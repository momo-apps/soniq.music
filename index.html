<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immersive YouTube Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }
        
        #yt-player {
            width: 100%;
            height: 100%;
            background: #000;
        }
        
        /* Gesture Overlay - Only for custom gestures */
        #gesture-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            display: flex;
        }
        
        .gesture-panel {
            flex: 1;
            height: 100%;
            /* Let YouTube controls handle their own areas */
        }
        
        /* Center area for double-tap play/pause */
        #center-area {
            position: absolute;
            top: 25%;
            left: 25%;
            right: 25%;
            bottom: 25%;
            z-index: 5;
            /* background: rgba(255,0,0,0.1); */ /* Debug */
        }
        
        /* HUD Elements */
        .hud {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            z-index: 20;
            display: none;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        
        #seek-hud {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        #volume-hud {
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
        }
        
        #brightness-hud {
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
        }
        
        .hud.visible {
            display: flex;
        }
        
        .hud-icon {
            font-size: 20px;
        }
        
        /* Playback Speed HUD */
        #speed-hud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            z-index: 25;
            display: none;
        }
        
        #speed-hud.visible {
            display: block;
        }
        
        /* Center Tap Indicator */
        #center-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            z-index: 15;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }
        
        #center-indicator.visible {
            opacity: 1;
        }
        
        /* Loading Spinner */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            z-index: 5;
            display: none;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="yt-player"></div>
        <div id="loading"></div>
        
        <!-- Center area for double-tap play/pause -->
        <div id="center-area"></div>
        
        <!-- Gesture Overlay - Only for custom gestures -->
        <div id="gesture-overlay">
            <div class="gesture-panel" id="left-panel"></div>
            <div class="gesture-panel" id="center-panel"></div>
            <div class="gesture-panel" id="right-panel"></div>
        </div>
        
        <!-- HUD Elements -->
        <div id="seek-hud" class="hud">
            <span id="seek-time">00:00:00 / 00:00:00 [+00:00]</span>
        </div>
        
        <div id="volume-hud" class="hud">
            <span class="hud-icon">🔊</span>
            <span id="volume-level">50%</span>
        </div>
        
        <div id="brightness-hud" class="hud">
            <span class="hud-icon">🌞</span>
            <span id="brightness-level">100%</span>
        </div>
        
        <div id="speed-hud">2× Speed</div>
        
        <div id="center-indicator">⏸️</div>
    </div>

    <script>
        // Configuration - Adjust these values to change sensitivity
        const CONFIG = {
            SEEK_SENSITIVITY: 0.3,        // Lower = less sensitive seeking
            VOLUME_SENSITIVITY: 1.5,      // Higher = less sensitive volume
            BRIGHTNESS_SENSITIVITY: 1.5,  // Higher = less sensitive brightness
            LONG_PRESS_DURATION: 500,     // ms for long press
            HUD_DISPLAY_TIME: 1500,       // ms to show HUDs
            DOUBLE_TAP_DELAY: 300         // ms for double tap detection
        };

        // Get video ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('videoId') || 'dQw4w9WgXcQ'; // Default video

        // Player state
        let player;
        let playerReady = false;
        let currentVolume = 50;
        let currentBrightness = 1;
        let isSeeking = false;
        let isAdjustingVolume = false;
        let isAdjustingBrightness = false;
        let longPressTimer = null;
        let isLongPressing = false;
        let lastTapTime = 0;

        // DOM Elements
        const playerContainer = document.getElementById('player-container');
        const loadingSpinner = document.getElementById('loading');
        const seekHud = document.getElementById('seek-hud');
        const volumeHud = document.getElementById('volume-hud');
        const brightnessHud = document.getElementById('brightness-hud');
        const speedHud = document.getElementById('speed-hud');
        const centerIndicator = document.getElementById('center-indicator');
        const leftPanel = document.getElementById('left-panel');
        const centerPanel = document.getElementById('center-panel');
        const rightPanel = document.getElementById('right-panel');
        const centerArea = document.getElementById('center-area');
        const seekTimeElement = document.getElementById('seek-time');
        const volumeLevelElement = document.getElementById('volume-level');
        const brightnessLevelElement = document.getElementById('brightness-level');

        // Initialize YouTube Player
        function initYouTubePlayer() {
            // Load YouTube IFrame API
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        }

        // YouTube API ready callback
        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,  // Show native YouTube controls
                    'rel': 0,
                    'modestbranding': 1,
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'fs': 1,        // Allow fullscreen
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        };

        // Player ready event
        function onPlayerReady(event) {
            playerReady = true;
            loadingSpinner.style.display = 'none';
            
            // Set initial volume
            player.setVolume(currentVolume);
            
            // Set video to 16:9 aspect ratio
            setVideoSize('16:9');
            
            console.log('YouTube Player Ready');
        }

        // Player state change event
        function onPlayerStateChange(event) {
            // Update center indicator based on play state
            if (event.data === YT.PlayerState.PLAYING) {
                centerIndicator.textContent = '⏸️';
            } else {
                centerIndicator.textContent = '▶️';
            }
            
            // Show loading when buffering
            if (event.data === YT.PlayerState.BUFFERING) {
                loadingSpinner.style.display = 'block';
            } else {
                loadingSpinner.style.display = 'none';
            }
        }

        // Player error event
        function onPlayerError(event) {
            console.error('YouTube Player Error:', event);
            loadingSpinner.style.display = 'none';
        }

        // Set video size to 16:9 - Only affects video, not controls
        function setVideoSize(aspectRatio) {
            if (!playerReady) return;
            
            // For 16:9, we let YouTube handle the video aspect ratio
            // while keeping the controls visible
            const iframe = document.getElementById('yt-player');
            iframe.style.objectFit = 'contain';
            
            // If you want to force 16:9 without cropping, use 'contain'
            // If you want to fill the screen with possible cropping, use 'cover'
            if (aspectRatio === '16:9') {
                // YouTube player will automatically maintain 16:9 aspect ratio
                // with controls visible below the video
            }
        }

        // Format time in HH:MM:SS
        function formatTime(totalSeconds) {
            totalSeconds = Math.max(0, Math.floor(totalSeconds || 0));
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            if (hours > 0) {
                return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            } else {
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }

        // Format seek display: current/total[+/-seek_time]
        function formatSeekDisplay(current, total, delta) {
            const currentFormatted = formatTime(current);
            const totalFormatted = formatTime(total);
            const deltaFormatted = formatTime(Math.abs(delta));
            const sign = delta >= 0 ? '+' : '-';
            
            return `${currentFormatted} / ${totalFormatted} [${sign}${deltaFormatted}]`;
        }

        // Show HUD with timeout
        function showHud(hudElement, timeout = CONFIG.HUD_DISPLAY_TIME) {
            hudElement.classList.add('visible');
            clearTimeout(hudElement.timeoutId);
            hudElement.timeoutId = setTimeout(() => {
                hudElement.classList.remove('visible');
            }, timeout);
        }

        // Seek video
        function seekVideo(delta) {
            if (!playerReady) return;
            
            const currentTime = player.getCurrentTime();
            const duration = player.getDuration();
            const newTime = Math.max(0, Math.min(duration, currentTime + delta));
            
            // Update HUD
            seekTimeElement.textContent = formatSeekDisplay(newTime, duration, delta);
            showHud(seekHud);
            
            // Seek to new time
            player.seekTo(newTime, true);
        }

        // Adjust volume
        function adjustVolume(delta) {
            if (!playerReady) return;
            
            currentVolume = Math.max(0, Math.min(100, currentVolume + delta));
            player.setVolume(currentVolume);
            
            // Update HUD
            volumeLevelElement.textContent = `${Math.round(currentVolume)}%`;
            showHud(volumeHud);
        }

        // Adjust brightness
        function adjustBrightness(delta) {
            currentBrightness = Math.max(0.1, Math.min(1, currentBrightness + delta));
            
            // Apply brightness filter to video wrapper
            document.body.style.filter = `brightness(${currentBrightness})`;
            
            // Update HUD
            brightnessLevelElement.textContent = `${Math.round(currentBrightness * 100)}%`;
            showHud(brightnessHud);
        }

        // Toggle play/pause
        function togglePlayPause() {
            if (!playerReady) return;
            
            const playerState = player.getPlayerState();
            
            if (playerState === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                centerIndicator.textContent = '▶️';
            } else {
                player.playVideo();
                centerIndicator.textContent = '⏸️';
            }
            
            // Show center indicator briefly
            centerIndicator.classList.add('visible');
            setTimeout(() => {
                centerIndicator.classList.remove('visible');
            }, 500);
        }

        // Handle window resize
        function handleResize() {
            if (playerReady) {
                setVideoSize('16:9');
            }
        }

        // Initialize gesture controls
        function initGestureControls() {
            let startX, startY;
            let startTime;
            let isHorizontalGesture = false;
            let isVerticalGesture = false;
            
            // Touch start event - Only on gesture overlay, not on YouTube controls
            function handleTouchStart(e) {
                // Don't interfere with YouTube controls
                if (e.target.closest('.ytp-chrome-top') || 
                    e.target.closest('.ytp-chrome-bottom') ||
                    e.target.closest('.ytp-progress-bar')) {
                    return;
                }
                
                if (!playerReady) return;
                
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                startTime = Date.now();
                
                // Reset flags
                isHorizontalGesture = false;
                isVerticalGesture = false;
                isSeeking = false;
                isAdjustingVolume = false;
                isAdjustingBrightness = false;
                
                // Start long press timer
                isLongPressing = false;
                longPressTimer = setTimeout(() => {
                    isLongPressing = true;
                    player.setPlaybackRate(2);
                    showHud(speedHud, 1000);
                }, CONFIG.LONG_PRESS_DURATION);
            }
            
            // Touch move event
            function handleTouchMove(e) {
                // Don't interfere with YouTube controls
                if (e.target.closest('.ytp-chrome-top') || 
                    e.target.closest('.ytp-chrome-bottom') ||
                    e.target.closest('.ytp-progress-bar')) {
                    return;
                }
                
                if (!playerReady || !startX || !startY) return;
                
                const touch = e.touches[0];
                const deltaX = touch.clientX - startX;
                const deltaY = touch.clientY - startY;
                const currentTime = Date.now();
                
                // Cancel long press if moved too much
                if (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10) {
                    clearTimeout(longPressTimer);
                }
                
                // Determine gesture direction after minimum movement
                if (!isHorizontalGesture && !isVerticalGesture) {
                    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 10) {
                        isHorizontalGesture = true;
                        isSeeking = true;
                        e.preventDefault(); // Prevent scrolling when seeking
                    } else if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 10) {
                        isVerticalGesture = true;
                        
                        // Determine which side of screen for volume/brightness
                        if (startX < window.innerWidth / 2) {
                            isAdjustingBrightness = true;
                        } else {
                            isAdjustingVolume = true;
                        }
                        e.preventDefault(); // Prevent scrolling when adjusting
                    }
                }
                
                // Handle horizontal gesture (seeking)
                if (isHorizontalGesture && isSeeking) {
                    const timeDelta = (deltaX / window.innerWidth) * (player.getDuration() || 600) * CONFIG.SEEK_SENSITIVITY;
                    
                    // Apply velocity factor based on movement speed
                    const elapsed = currentTime - startTime;
                    const velocity = Math.min(3, 1 + (Math.abs(deltaX) / elapsed) * 0.05);
                    const adjustedDelta = timeDelta * velocity;
                    
                    seekVideo(adjustedDelta);
                }
                
                // Handle vertical gestures
                if (isVerticalGesture) {
                    const delta = -deltaY / window.innerHeight; // Invert for natural feel
                    
                    if (isAdjustingVolume) {
                        const volumeDelta = delta * 100 / CONFIG.VOLUME_SENSITIVITY;
                        adjustVolume(volumeDelta);
                    } else if (isAdjustingBrightness) {
                        const brightnessDelta = delta / CONFIG.BRIGHTNESS_SENSITIVITY;
                        adjustBrightness(brightnessDelta);
                    }
                }
            }
            
            // Touch end event
            function handleTouchEnd(e) {
                clearTimeout(longPressTimer);
                
                // Reset playback speed if long press was active
                if (isLongPressing) {
                    player.setPlaybackRate(1);
                }
                
                // Reset all flags
                isHorizontalGesture = false;
                isVerticalGesture = false;
                isSeeking = false;
                isAdjustingVolume = false;
                isAdjustingBrightness = false;
                isLongPressing = false;
                startX = null;
                startY = null;
            }
            
            // Add event listeners to gesture overlay
            const gestureOverlay = document.getElementById('gesture-overlay');
            gestureOverlay.addEventListener('touchstart', handleTouchStart, { passive: true });
            gestureOverlay.addEventListener('touchmove', handleTouchMove, { passive: false });
            gestureOverlay.addEventListener('touchend', handleTouchEnd);
            
            // Double tap for play/pause on center area
            centerArea.addEventListener('touchend', function(e) {
                // Don't interfere with YouTube controls
                if (e.target.closest('.ytp-chrome-top') || 
                    e.target.closest('.ytp-chrome-bottom') ||
                    e.target.closest('.ytp-progress-bar')) {
                    return;
                }
                
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                
                if (tapLength < CONFIG.DOUBLE_TAP_DELAY && tapLength > 0) {
                    // Double tap detected
                    togglePlayPause();
                    e.preventDefault();
                }
                
                lastTapTime = currentTime;
            });
            
            // Single tap to show YouTube controls
            gestureOverlay.addEventListener('click', function(e) {
                // Let YouTube handle the tap to show controls
                // We don't need to do anything special here
            });
        }

        // Initialize the player
        function init() {
            initYouTubePlayer();
            initGestureControls();
            
            // Handle window resize
            window.addEventListener('resize', handleResize);
        }

        // Start initialization when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
