<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>YouTube Player — Soniq</title>

<!-- preconnect to speed up youtube resources -->
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://s.ytimg.com">
<link rel="preconnect" href="https://www.google-analytics.com">

<style>
  :root{
    --ui-size:56px; --accent:#1db954; --bg:#000; --fg:#fff; --muted:rgba(255,255,255,0.06);
    --hud-bg: rgba(0,0,0,0.7);
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;font-family:system-ui, Arial;}
  #app{position:relative;width:100%;height:100vh;overflow:hidden;touch-action:none;background:#000;}
  #playerWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  #yt-player{width:100%;height:100%;display:block;object-fit:cover;}

  /* Skeleton & spinner (shows while player loads) */
  #skeleton{position:absolute;inset:0;background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.04));display:flex;align-items:center;justify-content:center;z-index:50}
  #spinner{width:64px;height:64px;border-radius:50%;border:6px solid rgba(255,255,255,0.06);border-top-color:var(--accent);animation:spin 900ms linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* HUD overlays */
  .hud { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none; background:var(--hud-bg); color:#fff; padding:8px 12px; border-radius:8px; font-size:16px; display:none; z-index:60}
  #seekPreview { position:absolute; bottom:48%; left:50%; transform:translate(-50%,0); pointer-events:none; background:var(--hud-bg); padding:6px 10px; border-radius:8px; display:none; z-index:60}

  /* Volume / brightness HUD */
  .sideHUD { position:absolute; left:50%; top:20%; transform:translateX(-50%); pointer-events:none; display:none; z-index:65; }
  .barWrap{ width:220px; background:rgba(255,255,255,0.06); border-radius:10px; padding:8px; display:flex; gap:8px; align-items:center; }
  .bar { height:8px; width:100%; background:rgba(255,255,255,0.12); border-radius:6px; overflow:hidden; }
  .barFill { height:100%; width:0%; background:var(--accent); border-radius:6px; transition:width 120ms linear; }
  .hudLabel{min-width:60px; text-align:center; font-weight:600; color:#fff; font-size:13px;}

  /* Controls layout: bottom center */
  #controlsCenter { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); display:flex; gap:10px; pointer-events:auto; align-items:center; z-index:55; }
  .btn { width:var(--ui-size); height:var(--ui-size); border-radius:12px; background:var(--muted); display:flex; align-items:center; justify-content:center; color:var(--fg); border:0; font-size:18px; }
  .btn.small{ width:44px; height:44px; }

  /* share left, settings right */
  #btnShare{ position:absolute; left:12px; bottom:12px; z-index:55; pointer-events:auto; }
  #btnSettings{ position:absolute; right:12px; bottom:12px; z-index:55; pointer-events:auto; }

  /* aspect top-right */
  #btnAspect{ position:absolute; right:12px; top:12px; z-index:55; pointer-events:auto; }

  /* settings modal */
  #settingsModal { position:absolute; right:12px; bottom:72px; background:var(--hud-bg); color:#fff; padding:8px; border-radius:10px; display:none; z-index:80; min-width:120px; }
  #settingsModal button{display:block;width:100%;background:transparent;color:#fff;border:0;padding:6px 8px;text-align:left;border-radius:6px;}
  #settingsModal button:hover{background:rgba(255,255,255,0.04);}

  /* debug small text */
  #debug{ position:absolute; left:8px; top:8px; font-size:12px; color:#ccc; z-index:60; pointer-events:none; }

  /* responsive adjustments */
  @media (min-width:900px){
    .barWrap{ width:320px; }
  }
</style>
</head>
<body>
  <div id="app">
    <div id="playerWrap"><div id="yt-player"></div></div>

    <!-- skeleton while loading -->
    <div id="skeleton"><div id="spinner"></div></div>

    <!-- HUDs -->
    <div class="hud" id="mainHud">0:00 / 0:00</div>
    <div id="seekPreview">+0s</div>

    <!-- Volume & Brightness HUDs (shared) -->
    <div class="sideHUD" id="volumeHUD" style="left:auto; right:20px; top:40%;">
      <div class="barWrap"><div class="hudLabel" id="volLabel">Vol</div><div class="bar"><div class="barFill" id="volFill"></div></div></div>
    </div>
    <div class="sideHUD" id="brightnessHUD" style="left:20px; right:auto; top:40%;">
      <div class="barWrap"><div class="hudLabel" id="brightLabel">Bright</div><div class="bar"><div class="barFill" id="brightFill"></div></div></div>
    </div>

    <!-- Controls -->
    <div id="controlsCenter">
      <button class="btn small" id="btnRewind">⟲</button>
      <button class="btn" id="btnPlay">▶︎</button>
      <button class="btn small" id="btnForward">⟳</button>
      <button class="btn small" id="btnMute">🔇</button>
      <button class="btn small" id="btnSpeed">1×</button>
    </div>

    <button class="btn" id="btnShare" title="Share">⤴︎</button>
    <div style="position:relative;">
      <button class="btn" id="btnSettings" title="Settings">⚙︎</button>
      <div id="settingsModal"></div>
    </div>

    <button class="btn" id="btnAspect" title="Toggle Aspect">↔︎</button>

    <div id="debug"></div>
  </div>

<script>
/* ---------- config ---------- */
const DEFAULT_ID = 'dQw4w9WgXcQ';
const SEEK_DOUBLE_TAP_SEC = 10;
const DRAG_MAX_SEEK = 120;
const INITIAL_MUTED = true;

/* ---------- refs ---------- */
const debugEl = document.getElementById('debug');
const skeleton = document.getElementById('skeleton');
const mainHud = document.getElementById('mainHud');
const seekPreview = document.getElementById('seekPreview');

const volumeHUD = document.getElementById('volumeHUD');
const volFill = document.getElementById('volFill');
const volLabel = document.getElementById('volLabel');

const brightnessHUD = document.getElementById('brightnessHUD');
const brightFill = document.getElementById('brightFill');
const brightLabel = document.getElementById('brightLabel');

const btnPlay = document.getElementById('btnPlay');
const btnRewind = document.getElementById('btnRewind');
const btnForward = document.getElementById('btnForward');
const btnMute = document.getElementById('btnMute');
const btnSpeed = document.getElementById('btnSpeed');
const btnAspect = document.getElementById('btnAspect');
const btnShare = document.getElementById('btnShare');
const btnSettings = document.getElementById('btnSettings');
const settingsModal = document.getElementById('settingsModal');

let player = null;
let videoId = (new URLSearchParams(location.search)).get('videoId') || DEFAULT_ID;
let isPlaying = false, isMuted = INITIAL_MUTED;
let lastTap = 0, lastTapX = 0, lastTapY = 0;

/* ---------- load YouTube IFrame API (async) ---------- */
(function loadYouTubeAPI(){
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  tag.async = true;
  document.head.appendChild(tag);
})();

/* ---------- API callbacks ---------- */
function onYouTubeIframeAPIReady(){
  player = new YT.Player('yt-player', {
    width: '100%', height: '100%',
    videoId: videoId,
    playerVars: {
      autoplay: 1, controls: 1, rel: 0, modestbranding: 1, fs: 1,
      enablejsapi: 1, mute: INITIAL_MUTED ? 1 : 0, origin: window.location.origin
    },
    events: {
      onReady: onPlayerReady,
      onStateChange: onPlayerStateChange,
      onError: onPlayerError
    }
  });
}

function onPlayerReady(e){
  debug('player ready');
  hideSkeleton();
  try { e.target.playVideo(); } catch(e){}
  trySyncVolume();
  updateUI();
}

function onPlayerStateChange(ev){
  isPlaying = (ev.data === 1);
  updateUI();
  debug('state:'+ev.data);
}

function onPlayerError(ev){
  debug('player error:' + ev.data);
  alert('Player error: ' + ev.data + '\nIf it is an embedding restriction try a different video.');
}

/* ---------- UI helpers ---------- */
function debug(msg){ debugEl.textContent = msg; }
function hideSkeleton(){ skeleton.style.display = 'none'; }
function showSkeleton(){ skeleton.style.display = 'flex'; }

/* ---------- exposed functions for Android & console ---------- */
function toggleAspect(mode){
  // ensure global function exists so Android evaluateJavascript("toggleAspect('cover')") works
  const iframe = (player && player.getIframe) ? player.getIframe() : document.querySelector('#yt-player iframe');
  if(iframe){
    iframe.style.objectFit = (mode === 'contain' ? 'contain' : 'cover');
  }
}
window.toggleAspect = toggleAspect; // explicit global

function playVideo(){ if(player) player.playVideo(); }
function pauseVideo(){ if(player) player.pauseVideo(); }
function seekTo(sec){ if(player) player.seekTo(sec, true); }
function getCurrentTime(){ try { return player ? player.getCurrentTime() : 0 } catch(e){ return 0 } }
function getDuration(){ try { return player ? player.getDuration() : 0 } catch(e){ return 0 } }
function setPlaybackRate(r){ if(player) player.setPlaybackRate(r); btnSpeed.textContent = r + '×'; }
function mute(){ if(player){ player.mute(); isMuted=true; updateUI(); } }
function unMute(){ if(player){ player.unMute(); isMuted=false; updateUI(); } }
function setVolumePercent(p){ if(player && player.setVolume){ player.setVolume(Math.max(0,Math.min(100,Math.round(p)))); } }

/* ---------- button wiring ---------- */
btnPlay.addEventListener('click', () => { getPlayerStateThen(s => s===1 ? pauseVideo() : playVideo()); });
btnRewind.addEventListener('click', () => { getCurrentTimeThen(cur => seekTo(Math.max(0, cur - SEEK_DOUBLE_TAP_SEC))); showSeekPreview(`-${SEEK_DOUBLE_TAP_SEC}s`); });
btnForward.addEventListener('click', () => { getCurrentTimeThen(cur => seekTo(cur + SEEK_DOUBLE_TAP_SEC)); showSeekPreview(`+${SEEK_DOUBLE_TAP_SEC}s`); });
btnMute.addEventListener('click', () => {
  if(isMuted){ unMute(); player.setVolume(50); } else { mute(); }
  isMuted = !isMuted; updateUI();
});
btnSpeed.addEventListener('click', showSettingsMenu);
btnAspect.addEventListener('click', () => {
  // toggle in UI
  const iframe = (player && player.getIframe) ? player.getIframe() : document.querySelector('#yt-player iframe');
  if(iframe) {
    const cur = iframe.style.objectFit || 'cover';
    const next = cur === 'cover' ? 'contain' : 'cover';
    iframe.style.objectFit = next;
    btnAspect.textContent = (next === 'cover') ? '↔︎' : '⬚';
  }
});
btnShare.addEventListener('click', shareVideo);

/* ---------- settings (playback rate) ---------- */
async function showSettingsMenu(){
  if(!player) return;
  settingsModal.innerHTML = ''; settingsModal.style.display = 'block';
  // try to get available rates
  let rates = [];
  try { rates = player.getAvailablePlaybackRates ? player.getAvailablePlaybackRates() : []; } catch(e){ rates = [1,1.5,2]; }
  if(!rates || rates.length===0) rates = [1,1.25,1.5,2];
  rates.forEach(r => {
    const btn = document.createElement('button');
    btn.textContent = r + '×';
    btn.addEventListener('click', () => { setPlaybackRate(r); settingsModal.style.display='none'; });
    settingsModal.appendChild(btn);
  });
  // close area: click outside modal will hide
  setTimeout(()=> window.addEventListener('click', hideSettingsOnClickOutside));
}
function hideSettingsOnClickOutside(ev){
  const inside = settingsModal.contains(ev.target) || ev.target === btnSettings;
  if(!inside){ settingsModal.style.display='none'; window.removeEventListener('click', hideSettingsOnClickOutside);}
}

/* ---------- share implementation ---------- */
function shareVideo(){
  const url = location.origin + location.pathname + '?videoId=' + encodeURIComponent(videoId);
  if(navigator.share){
    navigator.share({ title:'Watch', url }).catch(()=>{ /* ignore */ });
  } else {
    // fallback: copy to clipboard
    navigator.clipboard?.writeText(url).then(()=> { alert('Link copied to clipboard'); }).catch(()=> { prompt('Copy link', url); });
  }
}

/* ---------- small async helpers ---------- */
function getPlayerStateThen(cb){ try{ cb(player ? player.getPlayerState() : -2); }catch(e){ cb(-2); } }
function getCurrentTimeThen(cb){ try{ cb(player ? player.getCurrentTime() : 0); }catch(e){ cb(0); } }

/* ---------- HUD helpers ---------- */
let seekTimeout = null;
function showSeekPreview(text){
  seekPreview.style.display = 'block';
  seekPreview.textContent = text;
  if(seekTimeout) clearTimeout(seekTimeout);
  seekTimeout = setTimeout(()=> seekPreview.style.display='none', 900);
}

let volHudTimer = null, brightHudTimer = null;
function showVolumeHUD(percent){
  volFill.style.width = Math.max(0, Math.min(100, percent)) + '%';
  volumeHUD.style.display = 'block';
  if(volHudTimer) clearTimeout(volHudTimer);
  volHudTimer = setTimeout(()=> volumeHUD.style.display='none', 900);
}
function showBrightnessHUD(percent){
  brightFill.style.width = Math.max(0, Math.min(100, percent)) + '%';
  brightnessHUD.style.display = 'block';
  if(brightHudTimer) clearTimeout(brightHudTimer);
  brightHudTimer = setTimeout(()=> brightnessHUD.style.display='none', 900);
}

/* ---------- gesture handling (touch) ---------- */
let touchActive=false, startX=0, startY=0, accDx=0, accDy=0, seeking=false, adjustType=null, currentVolume=50;

function onTouchStart(e){
  if(e.touches.length !== 1) return;
  touchActive=true;
  const t = e.touches[0];
  startX = t.clientX; startY = t.clientY; accDx=0; accDy=0;

  const now = Date.now();
  if(now - lastTap < 300 && Math.abs(lastTapX - startX) < 60 && Math.abs(lastTapY - startY) < 60){
    // double tap
    const w = window.innerWidth;
    if(startX < w*0.33){ getCurrentTimeThen(cur => { seekTo(Math.max(0,cur-SEEK_DOUBLE_TAP_SEC)); showSeekPreview(`-${SEEK_DOUBLE_TAP_SEC}s`); }); }
    else if(startX > w*0.66){ getCurrentTimeThen(cur => { seekTo(cur+SEEK_DOUBLE_TAP_SEC); showSeekPreview(`+${SEEK_DOUBLE_TAP_SEC}s`); }); }
    else { getPlayerStateThen(s => s===1 ? pauseVideo() : playVideo()); }
    lastTap = 0; e.preventDefault(); return;
  }
  lastTap = now; lastTapX = startX; lastTapY = startY;
}

function onTouchMove(e){
  if(!touchActive) return;
  const t = e.touches[0];
  const dx = t.clientX - startX; const dy = t.clientY - startY;
  accDx = dx; accDy = dy;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);

  if(!seeking && !adjustType){
    if(absDx > absDy && absDx > 12) seeking = true;
    else if(absDy > absDx && absDy > 12) adjustType = (startX > window.innerWidth/2) ? 'volume' : 'brightness';
  }
  if(seeking){
    const pct = dx / window.innerWidth;
    const delta = Math.round(pct * DRAG_MAX_SEEK);
    showSeekPreview((delta>0?'+':'') + delta + 's');
  } else if(adjustType){
    const pct = -dy / window.innerHeight; // up positive
    if(adjustType === 'volume'){
      const change = pct * 100;
      let v = currentVolume + change;
      v = Math.max(0, Math.min(100, v));
      setVolumePercent(v);
      currentVolume = v;
      showVolumeHUD(currentVolume);
    } else {
      // brightness simulate: update brightFill (we still can't change system brightness from web)
      const cur = parseFloat(brightFill.style.width) || 50;
      // interpret cur as percent; change relative
      let next = cur + pct*100;
      next = Math.max(0, Math.min(100, next));
      showBrightnessHUD(next);
      // also dim background slightly to simulate (not system brightness)
      document.getElementById('playerWrap').style.filter = `brightness(${0.6 + (next/100)*0.4})`;
    }
  }
  e.preventDefault();
}

function onTouchEnd(e){
  if(seeking){
    const dx = accDx;
    const pct = dx / window.innerWidth;
    const delta = Math.round(pct * DRAG_MAX_SEEK);
    getCurrentTimeThen(cur => {
      const dest = Math.max(0, Math.min((getDuration() || 99999), Math.round(cur + delta)));
      seekTo(dest);
      showSeekPreview((delta>0?'+':'') + delta + 's');
    });
  }
  touchActive=false; seeking=false; adjustType=null; accDx=0; accDy=0; lastTap=0;
}

/* hook events on app container */
const app = document.getElementById('app');
app.addEventListener('touchstart', onTouchStart, {passive:false});
app.addEventListener('touchmove', onTouchMove, {passive:false});
app.addEventListener('touchend', onTouchEnd, {passive:false});
app.addEventListener('touchcancel', onTouchEnd, {passive:false});

/* ---------- periodic sync for HUD ---------- */
setInterval(()=> {
  try {
    if(player) {
      const dur = getDuration(); const cur = getCurrentTime();
      mainHud.textContent = `${formatTime(Math.floor(cur))} / ${formatTime(Math.floor(dur))}`;
      // sync currentVolume (if available)
      currentVolume = (player && player.getVolume) ? (player.getVolume() || currentVolume) : currentVolume;
    }
  } catch(e){ /* ignore */ }
}, 800);

/* ---------- util ---------- */
function formatTime(s){ if(!s||s<0) return '0:00'; s=Math.floor(s); const m=Math.floor(s/60), sec=s%60; return m + ':' + (sec<10?'0':'')+sec; }
function trySyncVolume(){ try{ if(player && player.getVolume) currentVolume = player.getVolume(); }catch(e){} }

/* ensure mainHud visible but subtle */
mainHud.style.display = 'block'; mainHud.style.opacity = 0.95;

/* on load remove skeleton after 10 sec fallback */
window.addEventListener('load', ()=> {
  setTimeout(()=>{ if(!player) hideSkeleton(); }, 10000);
  debug('ready – videoId=' + videoId);
});
</script>
</body>
</html>
