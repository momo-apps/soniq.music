<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Soniq — YouTube Player</title>
<style>
  :root{
    --accent:#e50914; /* Netflix red */
    --bg:#000; --fg:#fff; --muted:rgba(255,255,255,0.06);
    --ui-h:56px;
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Arial,Helvetica}
  #app{position:relative;height:100vh;width:100vw;overflow:hidden;touch-action:none;background:#000}

  /* player */
  #playerWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:10}
  #yt-player{width:100%;height:100%;display:block;object-fit:cover}

  /* skeleton spinner */
  #skeleton{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg, rgba(255,255,255,0.01), rgba(255,255,255,0.02));z-index:40}
  #spinner{width:48px;height:48px;border-radius:50%;border:6px solid rgba(255,255,255,0.06);border-top-color:var(--accent);animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* HUDs */
  .hudBox{position:absolute;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.72);padding:8px 12px;border-radius:8px;color:#fff;font-size:14px;z-index:80;display:none}
  #mainHud{bottom:18%}
  #vHud{left:12%;top:40%;width:220px;transform:none;display:none}
  #bHud{right:12%;top:40%;width:220px;transform:none;display:none}
  .hudVal{font-weight:700;margin-left:6px}

  /* controls row */
  #controlsRow{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;z-index:60;pointer-events:none;display:flex;flex-direction:column;gap:8px}
  #scrubWrap{display:flex;align-items:center;gap:10px;pointer-events:auto}
  #timeLeft,#timeRight{color:#ddd;font-size:12px;min-width:70px;text-align:center}
  .scrubContainer{flex:1;position:relative;height:46px;display:flex;align-items:center}
  .progressBar{height:6px;border-radius:6px;background:rgba(255,255,255,0.06);width:100%;position:relative;overflow:visible}
  .progressFill{height:100%;width:0%;background:var(--accent);border-radius:6px;transition:width 120ms linear}
  .progressHandle{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,0.6);display:none}

  /* thumbnail preview */
  #thumbPreview{position:absolute;bottom:58px;left:0;transform:translateX(-50%);pointer-events:none;display:none;z-index:70;text-align:center}
  #thumbPreview .thumb{width:160px;height:90px;border-radius:6px;overflow:hidden;background:#111;display:block;box-shadow:0 6px 18px rgba(0,0,0,0.6)}
  #thumbPreview .time{margin-top:6px;color:#fff;font-size:12px}

  /* center controls */
  #controlsCenter{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:60;pointer-events:auto;opacity:0;transition:opacity .18s}
  #controlsCenter.visible{opacity:1}
  .btn{height:var(--ui-h);min-width:var(--ui-h);border-radius:12px;background:var(--muted);border:0;color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:18px}
  .btn.small{height:44px;min-width:44px;font-size:15px}

  /* full-screen settings overlay */
  #settingsOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:200;display:none;align-items:center;justify-content:center;padding:28px;box-sizing:border-box}
  #settingsContent{width:100%;max-width:900px;color:#fff;background:transparent}
  .settingsPanel{background:rgba(10,10,10,0.6);padding:18px;border-radius:12px;margin-bottom:16px}
  .settingsRow{display:flex;flex-wrap:wrap;gap:8px}

  /* end overlay */
  #endOverlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0.2));display:none;z-index:95;align-items:center;justify-content:center;flex-direction:column;gap:12px}

  /* hide controls */
  #app.controls-visible #controlsCenter,
  #app.controls-visible #controlsRow { opacity:1; pointer-events:auto; transition:opacity .12s ease-in-out; display:block; }
  #app:not(.controls-visible) #controlsCenter,
  #app:not(.controls-visible) #controlsRow { opacity:0; pointer-events:none; transition:opacity .12s ease-in-out; display:none; }

  .dragging .progressHandle{display:block}

  /* unmute CTA */
  #unmuteCTA{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:90;background:rgba(0,0,0,0.7);padding:12px 18px;border-radius:10px;display:none}

  @media (max-width:480px){ #thumbPreview .thumb{width:120px;height:68px} }
</style>
</head>
<body>
  <div id="app" class="">
    <div id="playerWrap"><div id="yt-player"></div></div>
    <div id="skeleton"><div id="spinner"></div></div>

    <!-- HUDs -->
    <div id="mainHud" class="hudBox">00:00:00 / 00:00:00</div>
    <div id="vHud" class="hudBox">Volume: <span id="vHudVal" class="hudVal">50%</span>
      <div style="height:6px;background:#222;border-radius:6px;margin-top:6px"><div id="vBar" style="height:6px;width:50%;background:var(--accent);border-radius:6px"></div></div>
    </div>
    <div id="bHud" class="hudBox">Brightness: <span id="bHudVal" class="hudVal">100%</span>
      <div style="height:6px;background:#222;border-radius:6px;margin-top:6px"><div id="bBar" style="height:6px;width:0%;background:var(--accent);border-radius:6px"></div></div>
    </div>

    <!-- bottom controls -->
    <div id="controlsRow">
      <div id="scrubWrap">
        <div id="timeLeft">00:00:00</div>
        <div class="scrubContainer">
          <div class="progressBar" id="progressBar">
            <div class="progressFill" id="progressFill"></div>
            <div class="progressHandle" id="progressHandle"></div>
          </div>
          <div id="thumbPreview"><div class="thumb"><img id="thumbImg" src="" style="width:100%;height:100%;object-fit:cover" /></div><div class="time" id="thumbTime">00:00:00</div></div>
        </div>
        <div id="timeRight">00:00:00</div>
      </div>
    </div>

    <!-- center controls -->
    <div id="controlsCenter">
      <button class="btn small" id="btnRewind" title="Rewind 10s">⟲</button>
      <button class="btn" id="btnPlay" title="Play/Pause">▶︎</button>
      <button class="btn small" id="btnForward" title="Forward 10s">⟳</button>
      <button class="btn small" id="btnSpeed" title="Speed">1×</button>
      <button class="btn small" id="btnAspect" title="Aspect">↔︎</button>
      <button class="btn small" id="btnMute" title="Mute/Unmute">🔇</button>
      <button class="btn small" id="btnSettings" title="Settings">⚙︎</button>
    </div>

    <!-- full-screen settings overlay -->
    <div id="settingsOverlay" role="dialog" aria-modal="true">
      <div id="settingsContent">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div style="font-size:20px;font-weight:700">Playback Settings</div>
          <div><button id="closeSettings" style="padding:8px 12px;border-radius:8px">Close</button></div>
        </div>

        <div class="settingsPanel">
          <div style="font-weight:700;margin-bottom:8px">Playback Speed</div>
          <div class="settingsRow" id="speedOptionsPanel"></div>
        </div>

        <div class="settingsPanel">
          <div style="font-weight:700;margin-bottom:8px">Quality</div>
          <div class="settingsRow" id="qualityOptionsPanel"></div>
        </div>
      </div>
    </div>

    <div id="unmuteCTA"><button id="tapToUnmute" style="padding:10px 16px;border-radius:8px;background:var(--accent);color:#fff;border:0">Tap to unmute</button></div>

    <div id="endOverlay" style="display:flex;">
      <div style="color:#fff;font-size:18px">Playback ended</div>
      <div><button id="replayBtn" class="btn">Replay</button></div>
    </div>
  </div>

<script>
/* ---------- config ---------- */
const DEFAULT_ID='dQw4w9WgXcQ';
const SEEK_DOUBLE_TAP_SEC=10;
const DRAG_MAX_SEEK=120;
const INITIAL_MUTED=true;
const CONTROLS_HIDE_MS=3000;
const MIN_PLAYED_SECONDS_BEFORE_END = 1.0; // avoid false ended

/* ---------- refs ---------- */
const app=document.getElementById('app');
const skeleton=document.getElementById('skeleton');
const mainHud=document.getElementById('mainHud');
const vHud=document.getElementById('vHud'), bHud=document.getElementById('bHud');
const vHudVal=document.getElementById('vHudVal'), bHudVal=document.getElementById('bHudVal');
const vBar=document.getElementById('vBar'), bBar=document.getElementById('bBar');
const timeLeft=document.getElementById('timeLeft'), timeRight=document.getElementById('timeRight');
const progressBar=document.getElementById('progressBar'), progressFill=document.getElementById('progressFill'), progressHandle=document.getElementById('progressHandle');
const thumbPreview=document.getElementById('thumbPreview'), thumbImg=document.getElementById('thumbImg'), thumbTime=document.getElementById('thumbTime');
const btnPlay=document.getElementById('btnPlay'), btnRewind=document.getElementById('btnRewind'), btnForward=document.getElementById('btnForward');
const btnMute=document.getElementById('btnMute'), btnSpeed=document.getElementById('btnSpeed'), btnAspect=document.getElementById('btnAspect');
const btnSettings=document.getElementById('btnSettings'), settingsOverlay=document.getElementById('settingsOverlay');
const speedOptionsPanel=document.getElementById('speedOptionsPanel'), qualityOptionsPanel=document.getElementById('qualityOptionsPanel');
const controlsCenter=document.getElementById('controlsCenter'), endOverlay=document.getElementById('endOverlay'), replayBtn=document.getElementById('replayBtn');
const unmuteCTA=document.getElementById('unmuteCTA'), tapToUnmute=document.getElementById('tapToUnmute'), closeSettings=document.getElementById('closeSettings');

let player=null, videoId=(new URLSearchParams(location.search)).get('videoId')||DEFAULT_ID;
let isPlaying=false, isMuted=INITIAL_MUTED, durationSec=0;
let controlsTimer=null, isPointerDown=false, currentVolume=50;
let playbackStartedAt=null;

/* ---------- load YouTube IFrame API ---------- */
(function(){const t=document.createElement('script'); t.src="https://www.youtube.com/iframe_api"; t.async=true; document.head.appendChild(t);})();

/* ---------- helpers ---------- */
function pad2(n){return String(n).padStart(2,'0');}
function formatHHMMSS(sec){
  sec=Math.max(0,Math.floor(sec||0));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return (h>0?pad2(h)+':':'') + pad2(m) + ':' + pad2(s);
}
function debug(){/* noop - removed debug text */}

/* ---------- IFrame callbacks ---------- */
function onYouTubeIframeAPIReady(){
  player=new YT.Player('yt-player',{
    width:'100%', height:'100%', videoId:videoId,
    playerVars:{autoplay:1,controls:0,rel:0,modestbranding:1,enablejsapi:1,fs:0,mute:INITIAL_MUTED?1:0,origin:window.location.origin,playsinline:1},
    events:{onReady:onPlayerReady,onStateChange:onPlayerStateChange,onError:onPlayerError}
  });
}

function onPlayerReady(evt){
  skeleton.style.display='none';
  // play muted first (improves autoplay reliability)
  try{ evt.target.playVideo(); }catch(e){}
  // attempt to unmute shortly after — if blocked, show CTA
  setTimeout(()=>{
    try {
      evt.target.unMute();
      evt.target.setVolume(60);
      isMuted=false; updateUI();
    } catch(e) {
      showUnmuteCTA();
    }
  }, 200);
  populateSpeedOptions();
  // don't populate quality until user opens settings (can be empty before metadata ready)
  showControlsTemporarily();
}

function onPlayerStateChange(ev){
  const s = ev.data;
  if(s === YT.PlayerState.PLAYING){
    // mark playback started time (used to avoid false ENDED)
    if(!playbackStartedAt) playbackStartedAt = performance.now();
    endOverlay.style.display='none';
  }
  if(s === YT.PlayerState.ENDED){
    // only show ended if playback actually ran for some seconds
    const playedSec = playbackStartedAt ? (performance.now() - playbackStartedAt)/1000 : 0;
    if(playedSec < MIN_PLAYED_SECONDS_BEFORE_END){
      // likely a false end — retry once
      try{ player.seekTo(0); player.playVideo(); }catch(e){}
    } else {
      endOverlay.style.display='flex';
    }
  } else {
    if(s !== YT.PlayerState.ENDED) endOverlay.style.display='none';
  }
  isPlaying = (s === YT.PlayerState.PLAYING);
  updateUI();
}

/* more robust error message */
function onPlayerError(ev){
  const code = ev && ev.data ? ev.data : 'unknown';
  alert('Playback error: ' + code + '. The video may be blocked for embedding or restricted.');
}

/* ---------- UI updates & wiring ---------- */
function updateUI(){
  btnPlay.textContent = isPlaying ? '❚❚' : '▶︎';
  btnMute.textContent = isMuted ? '🔇' : '🔊';
}

/* buttons */
btnPlay.addEventListener('click', ()=> getPlayerStateThen(s => s===1? pauseVideo(): playVideo()) );
btnRewind.addEventListener('click', ()=> getCurrentTimeThen(t => seekTo(Math.max(0, t-SEEK_DOUBLE_TAP_SEC))) );
btnForward.addEventListener('click', ()=> getCurrentTimeThen(t => seekTo(t + SEEK_DOUBLE_TAP_SEC)) );
btnMute.addEventListener('click', ()=>{
  if(isMuted){ unMute(); try{ player.setVolume(60); }catch(e){} isMuted=false; } else { mute(); isMuted=true; }
  updateUI(); showVolumeHud(currentVolume); showControlsTemporarily();
});
btnSpeed.addEventListener('click', ()=> openSettings('speed'));
btnAspect.addEventListener('click', ()=> { toggleAspectMode(); showControlsTemporarily(); });
btnSettings.addEventListener('click', ()=> openSettings('all'));
replayBtn.addEventListener('click', ()=> { if(player){ player.seekTo(0); player.playVideo(); endOverlay.style.display='none' } });

/* exposed player wrappers */
function playVideo(){ if(player) { player.playVideo(); showControlsTemporarily(); } }
function pauseVideo(){ if(player) { player.pauseVideo(); showControlsTemporarily(); } }
function seekTo(sec){ if(player) { player.seekTo(sec, true); } }
function getCurrentTime(){ try{return player?player.getCurrentTime():0;}catch(e){return 0;} }
function getDuration(){ try{return player?player.getDuration():0;}catch(e){return 0;} }
function setPlaybackRate(r){ try{ if(player) player.setPlaybackRate(r); btnSpeed.textContent = r + '×'; }catch(e){} }
function mute(){ try{ if(player) player.mute(); isMuted=true; updateUI(); }catch(e){} }
function unMute(){ try{ if(player) player.unMute(); isMuted=false; updateUI(); }catch(e){} }
function setVolumePercent(p){ try{ if(player && player.setVolume) player.setVolume(Math.max(0,Math.min(100,Math.round(p)))); }catch(e){} }

/* ---------- settings overlay (Netflix-like) ---------- */
function openSettings(kind){
  settingsOverlay.style.display='flex';
  populateSpeedOptions();
  // populate quality on demand (player.availableQualityLevels may be ready now)
  populateQualityOptions();
}
function closeSettingsOverlay(){ settingsOverlay.style.display='none'; }
closeSettings.addEventListener('click', closeSettingsOverlay);
settingsOverlay.addEventListener('pointerdown', (ev)=>{ if(ev.target === settingsOverlay) closeSettingsOverlay(); });

function populateSpeedOptions(){
  speedOptionsPanel.innerHTML='';
  const speeds=[0.5,0.75,1,1.25,1.5,2];
  let cur=1; try{ cur = player && player.getPlaybackRate ? player.getPlaybackRate() : 1 }catch(e){}
  speeds.forEach(s=>{
    const btn=document.createElement('button'); btn.textContent = s+'×';
    btn.style.fontWeight = (Math.abs(s-cur) < 1e-6) ? '700' : '400';
    btn.addEventListener('click', ()=>{ setPlaybackRate(s); populateSpeedOptions(); });
    speedOptionsPanel.appendChild(btn);
  });
}
function populateQualityOptions(){
  qualityOptionsPanel.innerHTML='';
  let levels=[];
  try{ levels = player.getAvailableQualityLevels ? player.getAvailableQualityLevels() : []; }catch(e){ levels=[]; }
  if(!levels || levels.length===0) levels=['hd1080','hd720','large','medium','small'];
  let cur='';
  try{ cur = player.getPlaybackQuality ? player.getPlaybackQuality() : ''; }catch(e){ cur=''; }
  levels.forEach(q=>{
    const btn=document.createElement('button'); btn.textContent=q;
    btn.style.fontWeight = (q===cur)?'700':'400';
    btn.addEventListener('click', ()=>{ try{ if(player.setPlaybackQuality) player.setPlaybackQuality(q); }catch(e){} populateQualityOptions(); });
    qualityOptionsPanel.appendChild(btn);
  });
}

/* ---------- scrubber + thumbnail ---------- */
let scrubRect=null, pointerDown=false;
progressBar.addEventListener('pointerdown', (e)=>{ pointerDown=true; isPointerDown=true; scrubRect=progressBar.getBoundingClientRect(); app.classList.add('dragging'); handleScrubPointer(e); document.documentElement.style.touchAction='none'; showControlsTemporarily(); });
window.addEventListener('pointermove', (e)=>{ if(pointerDown) handleScrubPointer(e); });
window.addEventListener('pointerup', (e)=>{ if(pointerDown){ commitScrub(e); pointerDown=false; isPointerDown=false; app.classList.remove('dragging'); thumbPreview.style.display='none'; document.documentElement.style.touchAction=''; } });

function handleScrubPointer(e){
  if(!scrubRect) scrubRect=progressBar.getBoundingClientRect();
  let x=Math.min(scrubRect.right, Math.max(scrubRect.left, e.clientX));
  let pct=(x-scrubRect.left)/scrubRect.width; pct=Math.max(0,Math.min(1,pct));
  const dur=getDuration()||0; const t=Math.round(pct*dur);
  positionThumb(x); showThumb(t);
  progressFill.style.width=(pct*100)+'%';
  progressHandle.style.left=(pct*100)+'%';
}
function commitScrub(e){
  if(!scrubRect) return;
  let x=Math.min(scrubRect.right, Math.max(scrubRect.left, e.clientX));
  let pct=(x-scrubRect.left)/scrubRect.width; pct=Math.max(0,Math.min(1,pct));
  const dur=getDuration()||0; const t=Math.round(pct*dur);
  seekTo(t); showThumbMessage(formatHHMMSS(t));
}
function positionThumb(screenX){
  const wrap=progressBar.getBoundingClientRect(); const local=Math.min(Math.max(screenX-wrap.left,40),wrap.width-40);
  const globalLeft=(wrap.left + local); const pct=(globalLeft/window.innerWidth)*100;
  thumbPreview.style.left=pct+'vw'; thumbPreview.style.display='block';
}
function showThumb(sec){
  const urls=[`https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`,`https://i.ytimg.com/vi/${videoId}/sddefault.jpg`,`https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`,`https://i.ytimg.com/vi/${videoId}/mqdefault.jpg`,`https://i.ytimg.com/vi/${videoId}/default.jpg`];
  thumbImg.src=urls[0];
  thumbImg.onerror=function(){ for(let i=1;i<urls.length;i++){ const test=new Image(); test.src=urls[i]; test.onload=(function(u){return function(){ thumbImg.src=u; thumbImg.onerror=null; };})(urls[i]); } };
  thumbTime.textContent=formatHHMMSS(sec);
}
function showThumbMessage(txt){ thumbPreview.style.display='block'; thumbTime.textContent=txt; setTimeout(()=>{ thumbPreview.style.display='none'; },900); }

/* ---------- gestures: tap/double-tap, drag (seek), vertical adjust, pinch ---------- */
let lastTouch=0,lastTouchX=0,lastTouchY=0,touchActive=false,startX=0,startY=0,accDx=0,accDy=0,seekingGesture=false,adjustType=null;
let pinchMode=false, pinchStartDist=0, pinchScale=1;

function getDist(a,b){ const dx=a.clientX-b.clientX, dy=a.clientY-b.clientY; return Math.hypot(dx,dy); }

function onTouchStart(e){
  if(e.touches.length===2){ pinchMode=true; pinchStartDist=getDist(e.touches[0], e.touches[1]); pinchScale=1; return; }
  if(e.touches.length!==1) return;
  const t=e.touches[0]; startX=t.clientX; startY=t.clientY; accDx=0; accDy=0; touchActive=true;
  const now=Date.now();
  if(now-lastTouch<300 && Math.abs(lastTouchX-startX)<60 && Math.abs(lastTouchY-startY)<60){
    const w=window.innerWidth;
    if(startX < w*0.33){ getCurrentTimeThen(cur=>seekTo(Math.max(0,cur-SEEK_DOUBLE_TAP_SEC))); showThumbMessage('-'+SEEK_DOUBLE_TAP_SEC+'s'); }
    else if(startX > w*0.66){ getCurrentTimeThen(cur=>seekTo(cur+SEEK_DOUBLE_TAP_SEC)); showThumbMessage('+'+SEEK_DOUBLE_TAP_SEC+'s'); }
    else { getPlayerStateThen(s=> s===1? pauseVideo(): playVideo()); }
    lastTouch=0; e.preventDefault(); return;
  }
  lastTouch=now; lastTouchX=startX; lastTouchY=startY;
  showControlsTemporarily(); tryUnmuteOnGesture();
}
function onTouchMove(e){
  if(pinchMode && e.touches.length===2){ const d=getDist(e.touches[0], e.touches[1]); pinchScale = d / pinchStartDist; applyPinchScale(pinchScale); e.preventDefault(); return; }
  if(!touchActive) return;
  const t=e.touches[0]; const dx=t.clientX-startX, dy=t.clientY-startY; accDx=dx; accDy=dy;
  const adx=Math.abs(dx), ady=Math.abs(dy);
  if(!seekingGesture && !adjustType){
    if(adx>ady && adx>12) seekingGesture=true;
    else if(ady>adx && ady>12) adjustType=(startX>window.innerWidth/2)?'volume':'brightness';
  }
  if(seekingGesture){
    const pct=dx/window.innerWidth; const delta=Math.round(pct*DRAG_MAX_SEEK);
    showThumbMessage((delta>0?'+':'')+delta+'s');
    const cur=getCurrentTime()||0, dur=getDuration()||1;
    const fill = Math.max(0, Math.min(1, (cur + pct*DRAG_MAX_SEEK)/dur));
    progressFill.style.width = (fill*100)+'%';
  } else if(adjustType){
    const pct=-dy/window.innerHeight;
    if(adjustType === 'volume'){
      const change = pct*100; let v = currentVolume + change; v=Math.max(0,Math.min(100,v)); setVolumePercent(v); currentVolume=v;
      showVolumeHud(currentVolume);
    } else {
      const pw=document.getElementById('playerWrap');
      let curFilter = 1;
      try { const m = (pw.style.filter||'').match(/brightness\(([^)]+)\)/); if(m) curFilter = parseFloat(m[1]); } catch(e){}
      let brightness = curFilter + pct*0.18; brightness = Math.max(0.4, Math.min(1.6, brightness));
      pw.style.filter = `brightness(${brightness})`;
      const percent = Math.round(((brightness-0.4)/(1.2))*100);
      showBrightnessHud(percent);
    }
  }
  e.preventDefault();
}
function onTouchEnd(e){
  if(pinchMode){ commitPinch(); pinchMode=false; pinchStartDist=0; pinchScale=1; return; }
  if(seekingGesture){
    const dx=accDx; const pct=dx/window.innerWidth; const delta=Math.round(pct*DRAG_MAX_SEEK);
    getCurrentTimeThen(cur=>{ const dest=Math.max(0, Math.min((getDuration()||99999), Math.round(cur + delta))); seekTo(dest); showThumbMessage((delta>0?'+':'')+delta+'s'); });
  }
  touchActive=false; seekingGesture=false; adjustType=null; accDx=0; accDy=0; lastTouch=0;
}

/* pinch */
function applyPinchScale(scale){
  const clamp = Math.max(1, Math.min(1.9, scale));
  const iframe = document.querySelector('#yt-player iframe');
  if(iframe) iframe.style.transform = `scale(${clamp})`;
}
function commitPinch(){
  const iframe = document.querySelector('#yt-player iframe');
  if(!iframe) return;
  const scale = parseFloat((iframe.style.transform || '').replace(/[^0-9.]/g,'')) || 1;
  iframe.style.transform='';
  if(scale > 1.12 && player && player.setSize){
    const pw=document.getElementById('playerWrap'); const w=pw.clientWidth, h=pw.clientHeight;
    player.setSize(Math.round(w*scale), Math.round(h*scale));
  } else {
    applyAspectMode((btnAspect.getAttribute('data-mode')||'cover'));
  }
}

/* attach touch listeners */
app.addEventListener('touchstart', onTouchStart, {passive:false});
app.addEventListener('touchmove', onTouchMove, {passive:false});
app.addEventListener('touchend', onTouchEnd, {passive:false});
app.addEventListener('touchcancel', onTouchEnd, {passive:false});

/* ---------- unmute CTA ---------- */
function showUnmuteCTA(){ unmuteCTA.style.display='block'; }
tapToUnmute.addEventListener('click', ()=>{
  try { player.unMute(); player.setVolume(60); isMuted=false; updateUI(); unmuteCTA.style.display='none'; } catch(e){ alert('Tap to unmute failed'); }
});

/* ---------- HUD helpers ---------- */
let hudTimer=null;
function showVolumeHud(p){
  vHud.style.display='block'; vHudVal.textContent = Math.round(p) + '%'; vBar.style.width = Math.round(p) + '%';
  clearTimeout(hudTimer); hudTimer=setTimeout(()=> vHud.style.display='none',900);
}
function showBrightnessHud(p){
  bHud.style.display='block'; bHudVal.textContent = Math.round(p) + '%'; bBar.style.width = Math.round(p) + '%';
  clearTimeout(hudTimer); hudTimer=setTimeout(()=> bHud.style.display='none',900);
}
function showMainHud(txt){
  mainHud.style.display='block'; mainHud.textContent = txt; clearTimeout(hudTimer); hudTimer=setTimeout(()=> mainHud.style.display='none',900);
}

/* ---------- controls visibility (tap toggles) ---------- */
function showControlsTemporarily(){
  app.classList.add('controls-visible'); controlsCenter.classList.add('visible');
  if(controlsTimer) clearTimeout(controlsTimer);
  if(settingsOverlay.style.display==='flex') return;
  controlsTimer = setTimeout(()=>{ app.classList.remove('controls-visible'); controlsCenter.classList.remove('visible'); }, CONTROLS_HIDE_MS);
}
function toggleControls(){
  if(app.classList.contains('controls-visible')) { app.classList.remove('controls-visible'); controlsCenter.classList.remove('visible'); }
  else showControlsTemporarily();
}
document.addEventListener('mousemove', showControlsTemporarily);
document.addEventListener('touchstart', showControlsTemporarily);
/* click on the player toggles controls (ignore buttons) */
app.addEventListener('click', (ev)=>{ if(ev.target.closest('.btn')) return; toggleControls(); });

/* ---------- animation frame loop for UI ---------- */
function rafLoop(){
  try{
    if(player && player.getCurrentTime){
      const cur=Math.floor(getCurrentTime()||0), dur=Math.floor(getDuration()||0);
      timeLeft.textContent = formatHHMMSS(cur); timeRight.textContent = formatHHMMSS(dur);
      mainHud.textContent = formatHHMMSS(cur) + ' / ' + formatHHMMSS(dur);
      const pct = (dur>0) ? Math.max(0, Math.min(1, cur/dur)) : 0;
      if(!isPointerDown) { progressFill.style.width = (pct*100) + '%'; progressHandle.style.left = (pct*100) + '%'; }
    }
  }catch(e){}
  requestAnimationFrame(rafLoop);
}
requestAnimationFrame(rafLoop);

/* ---------- helpers ---------- */
function getPlayerStateThen(cb){ try{ cb(player?player.getPlayerState():-2); }catch(e){ cb(-2); } }
function getCurrentTimeThen(cb){ try{ cb(player?player.getCurrentTime():0); }catch(e){ cb(0); } }

/* ---------- thumbnail init & skeleton fallback ---------- */
thumbImg.src = `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;
setTimeout(()=>{ if(!player) skeleton.style.display='none'; }, 8000);

/* ---------- aspect helpers ---------- */
btnAspect.setAttribute('data-mode', 'cover');
function toggleAspectMode(){ const mode = (btnAspect.getAttribute('data-mode')||'cover') === 'cover' ? 'contain' : 'cover'; btnAspect.setAttribute('data-mode', mode); btnAspect.textContent = mode==='cover' ? '↔︎' : '⬚'; applyAspectMode(mode); }
function applyAspectMode(mode){
  const pw=document.getElementById('playerWrap'); const w=pw.clientWidth, h=pw.clientHeight;
  try{
    const iframe = document.querySelector('#yt-player iframe');
    if(iframe) iframe.style.objectFit = (mode==='cover' ? 'cover' : 'contain');
    if(player && player.setSize){
      if(mode==='cover'){ player.setSize(w,h); } else {
        const target=16/9; let nw=w, nh=Math.round(nw/target); if(nh>h){ nh=h; nw=Math.round(nh*target); } player.setSize(nw,nh);
      }
    }
  }catch(e){}
}

/* ---------- try unmute on user gesture ---------- */
function tryUnmuteOnGesture(){
  try{ player.unMute(); player.setVolume(60); isMuted=false; updateUI(); unmuteCTA.style.display='none'; }catch(e){}
}

  
/* ---------- ready - remove debug output ---------- */
/* All done */
</script>
