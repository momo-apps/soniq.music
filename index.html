<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immersive YouTube Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }
        
        #yt-player {
            width: 100%;
            height: 100%;
            background: #000;
        }
        
        /* Gesture Overlay - Only intercepts gestures, not taps */
        #gesture-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            /* Let single taps pass through to YouTube */
            pointer-events: none;
        }
        
        /* Gesture panels - Only active during gestures */
        .gesture-panel {
            position: absolute;
            top: 0;
            bottom: 0;
            pointer-events: auto;
        }
        
        #left-panel {
            left: 0;
            width: 30%;
            /* Only for brightness gestures */
        }
        
        #center-panel {
            left: 30%;
            width: 40%;
            /* Only for double-tap play/pause */
        }
        
        #right-panel {
            left: 70%;
            width: 30%;
            /* Only for volume gestures */
        }
        
        /* HUD Elements */
        .hud {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            z-index: 20;
            display: none;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        
        #seek-hud {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        #volume-hud {
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
        }
        
        #brightness-hud {
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
        }
        
        .hud.visible {
            display: flex;
        }
        
        .hud-icon {
            font-size: 20px;
        }
        
        /* Playback Speed HUD */
        #speed-hud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            z-index: 25;
            display: none;
        }
        
        #speed-hud.visible {
            display: block;
        }
        
        /* Center Tap Indicator */
        #center-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            z-index: 15;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }
        
        #center-indicator.visible {
            opacity: 1;
        }
        
        /* Loading Spinner */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            z-index: 5;
            display: none;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="yt-player"></div>
        <div id="loading"></div>
        
        <!-- Gesture Overlay - Only intercepts gestures, not taps -->
        <div id="gesture-overlay">
            <div class="gesture-panel" id="left-panel"></div>
            <div class="gesture-panel" id="center-panel"></div>
            <div class="gesture-panel" id="right-panel"></div>
        </div>
        
        <!-- HUD Elements -->
        <div id="seek-hud" class="hud">
            <span id="seek-time">00:00:00 / 00:00:00 [+00:00]</span>
        </div>
        
        <div id="volume-hud" class="hud">
            <span class="hud-icon">🔊</span>
            <span id="volume-level">50%</span>
        </div>
        
        <div id="brightness-hud" class="hud">
            <span class="hud-icon">🌞</span>
            <span id="brightness-level">100%</span>
        </div>
        
        <div id="speed-hud">2× Speed</div>
        
        <div id="center-indicator">⏸️</div>
    </div>

    <script>
        // Configuration - Adjust these values to change sensitivity
        const CONFIG = {
            SEEK_SENSITIVITY: 0.3,        // Lower = less sensitive seeking
            VOLUME_SENSITIVITY: 1.5,      // Higher = less sensitive volume
            BRIGHTNESS_SENSITIVITY: 1.5,  // Higher = less sensitive brightness
            LONG_PRESS_DURATION: 500,     // ms for long press
            HUD_DISPLAY_TIME: 1500,       // ms to show HUDs
            DOUBLE_TAP_DELAY: 300,        // ms for double tap detection
            GESTURE_THRESHOLD: 15         // Minimum movement to start gesture
        };

        // Get video ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('videoId') || 'dQw4w9WgXcQ'; // Default video

        // Player state
        let player;
        let playerReady = false;
        let currentVolume = 50;
        let currentBrightness = 1;
        let isGestureActive = false;
        let longPressTimer = null;
        let lastTapTime = 0;

        // DOM Elements
        const playerContainer = document.getElementById('player-container');
        const loadingSpinner = document.getElementById('loading');
        const seekHud = document.getElementById('seek-hud');
        const volumeHud = document.getElementById('volume-hud');
        const brightnessHud = document.getElementById('brightness-hud');
        const speedHud = document.getElementById('speed-hud');
        const centerIndicator = document.getElementById('center-indicator');
        const leftPanel = document.getElementById('left-panel');
        const centerPanel = document.getElementById('center-panel');
        const rightPanel = document.getElementById('right-panel');
        const seekTimeElement = document.getElementById('seek-time');
        const volumeLevelElement = document.getElementById('volume-level');
        const brightnessLevelElement = document.getElementById('brightness-level');

        // Initialize YouTube Player
        function initYouTubePlayer() {
            // Load YouTube IFrame API
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        }

        // YouTube API ready callback
        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,  // Show native YouTube controls
                    'rel': 0,
                    'modestbranding': 1,
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'fs': 1,        // Allow fullscreen
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        };

        // Player ready event
        function onPlayerReady(event) {
            playerReady = true;
            loadingSpinner.style.display = 'none';
            
            // Set initial volume
            player.setVolume(currentVolume);
            
            console.log('YouTube Player Ready');
        }

        // Player state change event
        function onPlayerStateChange(event) {
            // Update center indicator based on play state
            if (event.data === YT.PlayerState.PLAYING) {
                centerIndicator.textContent = '⏸️';
            } else {
                centerIndicator.textContent = '▶️';
            }
            
            // Show loading when buffering
            if (event.data === YT.PlayerState.BUFFERING) {
                loadingSpinner.style.display = 'block';
            } else {
                loadingSpinner.style.display = 'none';
            }
        }

        // Player error event
        function onPlayerError(event) {
            console.error('YouTube Player Error:', event);
            loadingSpinner.style.display = 'none';
        }

        // Format time in HH:MM:SS
        function formatTime(totalSeconds) {
            totalSeconds = Math.max(0, Math.floor(totalSeconds || 0));
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            if (hours > 0) {
                return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            } else {
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }

        // Format seek display: current/total[+/-seek_time]
        function formatSeekDisplay(current, total, delta) {
            const currentFormatted = formatTime(current);
            const totalFormatted = formatTime(total);
            const deltaFormatted = formatTime(Math.abs(delta));
            const sign = delta >= 0 ? '+' : '-';
            
            return `${currentFormatted} / ${totalFormatted} [${sign}${deltaFormatted}]`;
        }

        // Show HUD with timeout
        function showHud(hudElement, timeout = CONFIG.HUD_DISPLAY_TIME) {
            hudElement.classList.add('visible');
            clearTimeout(hudElement.timeoutId);
            hudElement.timeoutId = setTimeout(() => {
                hudElement.classList.remove('visible');
            }, timeout);
        }

        // Seek video
        function seekVideo(delta) {
            if (!playerReady) return;
            
            const currentTime = player.getCurrentTime();
            const duration = player.getDuration();
            const newTime = Math.max(0, Math.min(duration, currentTime + delta));
            
            // Update HUD
            seekTimeElement.textContent = formatSeekDisplay(newTime, duration, delta);
            showHud(seekHud);
            
            // Seek to new time
            player.seekTo(newTime, true);
        }

        // Adjust volume
        function adjustVolume(delta) {
            if (!playerReady) return;
            
            currentVolume = Math.max(0, Math.min(100, currentVolume + delta));
            player.setVolume(currentVolume);
            
            // Update HUD
            volumeLevelElement.textContent = `${Math.round(currentVolume)}%`;
            showHud(volumeHud);
        }

        // Adjust brightness
        function adjustBrightness(delta) {
            currentBrightness = Math.max(0.1, Math.min(1, currentBrightness + delta));
            
            // Apply brightness filter to video wrapper
            document.body.style.filter = `brightness(${currentBrightness})`;
            
            // Update HUD
            brightnessLevelElement.textContent = `${Math.round(currentBrightness * 100)}%`;
            showHud(brightnessHud);
        }

        // Toggle play/pause
        function togglePlayPause() {
            if (!playerReady) return;
            
            const playerState = player.getPlayerState();
            
            if (playerState === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                centerIndicator.textContent = '▶️';
            } else {
                player.playVideo();
                centerIndicator.textContent = '⏸️';
            }
            
            // Show center indicator briefly
            centerIndicator.classList.add('visible');
            setTimeout(() => {
                centerIndicator.classList.remove('visible');
            }, 500);
        }

        // Handle window resize
        function handleResize() {
            // YouTube player handles its own resizing
        }

        // Initialize gesture controls
        function initGestureControls() {
            let startX, startY;
            let gestureType = null; // 'seek', 'volume', 'brightness'
            
            // Touch start event
            function handleTouchStart(e) {
                if (!playerReady) return;
                
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                
                // Start long press timer
                longPressTimer = setTimeout(() => {
                    player.setPlaybackRate(2);
                    showHud(speedHud, 1000);
                }, CONFIG.LONG_PRESS_DURATION);
                
                // Don't prevent default - let YouTube handle single taps
            }
            
            // Touch move event
            function handleTouchMove(e) {
                if (!playerReady || !startX || !startY) return;
                
                const touch = e.touches[0];
                const deltaX = touch.clientX - startX;
                const deltaY = touch.clientY - startY;
                
                // Check if we've moved enough to start a gesture
                if (!isGestureActive && 
                    (Math.abs(deltaX) > CONFIG.GESTURE_THRESHOLD || 
                     Math.abs(deltaY) > CONFIG.GESTURE_THRESHOLD)) {
                    
                    // Cancel long press
                    clearTimeout(longPressTimer);
                    
                    // Determine gesture type
                    if (Math.abs(deltaX) > Math.abs(deltaY)) {
                        // Horizontal movement - seeking
                        gestureType = 'seek';
                    } else {
                        // Vertical movement - determine which side
                        if (startX < window.innerWidth / 2) {
                            gestureType = 'brightness';
                        } else {
                            gestureType = 'volume';
                        }
                    }
                    
                    isGestureActive = true;
                    e.preventDefault(); // Only prevent default when we're actively handling a gesture
                }
                
                // Handle active gesture
                if (isGestureActive) {
                    if (gestureType === 'seek') {
                        const timeDelta = (deltaX / window.innerWidth) * (player.getDuration() || 600) * CONFIG.SEEK_SENSITIVITY;
                        seekVideo(timeDelta);
                    } 
                    else if (gestureType === 'volume') {
                        const delta = -deltaY / window.innerHeight; // Invert for natural feel
                        const volumeDelta = delta * 100 / CONFIG.VOLUME_SENSITIVITY;
                        adjustVolume(volumeDelta);
                    } 
                    else if (gestureType === 'brightness') {
                        const delta = -deltaY / window.innerHeight; // Invert for natural feel
                        const brightnessDelta = delta / CONFIG.BRIGHTNESS_SENSITIVITY;
                        adjustBrightness(brightnessDelta);
                    }
                    
                    // Update start position for continuous tracking
                    startX = touch.clientX;
                    startY = touch.clientY;
                }
            }
            
            // Touch end event
            function handleTouchEnd(e) {
                clearTimeout(longPressTimer);
                
                // Reset playback speed if long press was active
                if (playerReady && player.getPlaybackRate() !== 1) {
                    player.setPlaybackRate(1);
                }
                
                // Reset gesture state
                isGestureActive = false;
                gestureType = null;
                startX = null;
                startY = null;
            }
            
            // Add event listeners to gesture panels
            const panels = [leftPanel, centerPanel, rightPanel];
            panels.forEach(panel => {
                panel.addEventListener('touchstart', handleTouchStart, { passive: true });
                panel.addEventListener('touchmove', handleTouchMove, { passive: false });
                panel.addEventListener('touchend', handleTouchEnd);
            });
            
            // Double tap for play/pause on center panel
            centerPanel.addEventListener('touchend', function(e) {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                
                if (tapLength < CONFIG.DOUBLE_TAP_DELAY && tapLength > 0) {
                    // Double tap detected
                    togglePlayPause();
                    e.preventDefault(); // Only prevent default for double taps
                }
                
                lastTapTime = currentTime;
            });
        }

        // Initialize the player
        function init() {
            initYouTubePlayer();
            initGestureControls();
            
            // Handle window resize
            window.addEventListener('resize', handleResize);
        }

        // Start initialization when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
