<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immersive YouTube Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
        }
        
        #video-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
        }
        
        #yt-player {
            width: 100%;
            height: 100%;
            background: #000;
        }
        
        /* Gesture Overlay */
        #gesture-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            display: flex;
        }
        
        .gesture-panel {
            flex: 1;
            height: 100%;
        }
        
        /* HUD Elements */
        .hud {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            z-index: 20;
            display: none;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        
        #seek-hud {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        #volume-hud {
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
        }
        
        #brightness-hud {
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
        }
        
        .hud.visible {
            display: flex;
        }
        
        .hud-icon {
            font-size: 20px;
        }
        
        /* Playback Speed HUD */
        #speed-hud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            z-index: 25;
            display: none;
        }
        
        #speed-hud.visible {
            display: block;
        }
        
        /* Center Tap Indicator */
        #center-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            z-index: 15;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        #center-indicator.visible {
            opacity: 1;
        }
        
        /* Loading Spinner */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            z-index: 5;
            display: none;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="video-wrapper">
            <div id="yt-player"></div>
            <div id="loading"></div>
            
            <!-- Gesture Overlay -->
            <div id="gesture-overlay">
                <div class="gesture-panel" id="left-panel"></div>
                <div class="gesture-panel" id="center-panel"></div>
                <div class="gesture-panel" id="right-panel"></div>
            </div>
            
            <!-- HUD Elements -->
            <div id="seek-hud" class="hud">
                <span id="seek-time">+0:00</span>
            </div>
            
            <div id="volume-hud" class="hud">
                <span class="hud-icon">🔊</span>
                <span id="volume-level">50%</span>
            </div>
            
            <div id="brightness-hud" class="hud">
                <span class="hud-icon">🌞</span>
                <span id="brightness-level">100%</span>
            </div>
            
            <div id="speed-hud">2× Speed</div>
            
            <div id="center-indicator">⏸️</div>
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            SEEK_SENSITIVITY: 0.5,      // Lower = more sensitive
            VOLUME_SENSITIVITY: 2,      // Higher = less sensitive
            BRIGHTNESS_SENSITIVITY: 2,  // Higher = less sensitive
            LONG_PRESS_DURATION: 500,   // ms for long press
            HUD_DISPLAY_TIME: 1000      // ms to show HUDs
        };

        // Get video ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('videoId') || 'dQw4w9WgXcQ'; // Default video

        // Player state
        let player;
        let playerReady = false;
        let currentVolume = 50;
        let currentBrightness = 1;
        let isSeeking = false;
        let isAdjustingVolume = false;
        let isAdjustingBrightness = false;
        let longPressTimer = null;
        let isLongPressing = false;

        // DOM Elements
        const playerContainer = document.getElementById('player-container');
        const videoWrapper = document.getElementById('video-wrapper');
        const loadingSpinner = document.getElementById('loading');
        const seekHud = document.getElementById('seek-hud');
        const volumeHud = document.getElementById('volume-hud');
        const brightnessHud = document.getElementById('brightness-hud');
        const speedHud = document.getElementById('speed-hud');
        const centerIndicator = document.getElementById('center-indicator');
        const leftPanel = document.getElementById('left-panel');
        const centerPanel = document.getElementById('center-panel');
        const rightPanel = document.getElementById('right-panel');
        const seekTimeElement = document.getElementById('seek-time');
        const volumeLevelElement = document.getElementById('volume-level');
        const brightnessLevelElement = document.getElementById('brightness-level');

        // Initialize YouTube Player
        function initYouTubePlayer() {
            // Load YouTube IFrame API
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        }

        // YouTube API ready callback
        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,  // Show native YouTube controls
                    'rel': 0,
                    'modestbranding': 1,
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'fs': 1,        // Allow fullscreen
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        };

        // Player ready event
        function onPlayerReady(event) {
            playerReady = true;
            loadingSpinner.style.display = 'none';
            
            // Set initial volume
            player.setVolume(currentVolume);
            
            // Set video to 16:9 aspect ratio
            setVideoSize('16:9');
            
            console.log('YouTube Player Ready');
        }

        // Player state change event
        function onPlayerStateChange(event) {
            // Update center indicator based on play state
            if (event.data === YT.PlayerState.PLAYING) {
                centerIndicator.textContent = '⏸️';
            } else {
                centerIndicator.textContent = '▶️';
            }
            
            // Show loading when buffering
            if (event.data === YT.PlayerState.BUFFERING) {
                loadingSpinner.style.display = 'block';
            } else {
                loadingSpinner.style.display = 'none';
            }
        }

        // Player error event
        function onPlayerError(event) {
            console.error('YouTube Player Error:', event);
            loadingSpinner.style.display = 'none';
        }

        // Set video size to 16:9
        function setVideoSize(aspectRatio) {
            if (!playerReady) return;
            
            const containerWidth = videoWrapper.clientWidth;
            const containerHeight = videoWrapper.clientHeight;
            
            if (aspectRatio === '16:9') {
                const videoHeight = containerWidth * 9 / 16;
                
                if (videoHeight <= containerHeight) {
                    // Width is the limiting factor
                    player.setSize(containerWidth, videoHeight);
                } else {
                    // Height is the limiting factor
                    const videoWidth = containerHeight * 16 / 9;
                    player.setSize(videoWidth, containerHeight);
                }
                
                // Center the video
                const iframe = document.getElementById('yt-player');
                iframe.style.margin = '0 auto';
                iframe.style.display = 'block';
            }
        }

        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(Math.abs(seconds) / 60);
            const secs = Math.floor(Math.abs(seconds) % 60);
            const sign = seconds < 0 ? '-' : '+';
            return `${sign}${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Show HUD with timeout
        function showHud(hudElement, timeout = CONFIG.HUD_DISPLAY_TIME) {
            hudElement.classList.add('visible');
            clearTimeout(hudElement.timeoutId);
            hudElement.timeoutId = setTimeout(() => {
                hudElement.classList.remove('visible');
            }, timeout);
        }

        // Seek video
        function seekVideo(delta) {
            if (!playerReady) return;
            
            const currentTime = player.getCurrentTime();
            const duration = player.getDuration();
            const newTime = Math.max(0, Math.min(duration, currentTime + delta));
            
            // Update HUD
            seekTimeElement.textContent = formatTime(delta);
            showHud(seekHud);
            
            // Seek to new time
            player.seekTo(newTime, true);
        }

        // Adjust volume
        function adjustVolume(delta) {
            if (!playerReady) return;
            
            currentVolume = Math.max(0, Math.min(100, currentVolume + delta));
            player.setVolume(currentVolume);
            
            // Update HUD
            volumeLevelElement.textContent = `${Math.round(currentVolume)}%`;
            showHud(volumeHud);
        }

        // Adjust brightness
        function adjustBrightness(delta) {
            currentBrightness = Math.max(0.1, Math.min(1, currentBrightness + delta));
            
            // Apply brightness filter to video wrapper
            videoWrapper.style.filter = `brightness(${currentBrightness})`;
            
            // Update HUD
            brightnessLevelElement.textContent = `${Math.round(currentBrightness * 100)}%`;
            showHud(brightnessHud);
        }

        // Toggle play/pause
        function togglePlayPause() {
            if (!playerReady) return;
            
            const playerState = player.getPlayerState();
            
            if (playerState === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                centerIndicator.textContent = '▶️';
            } else {
                player.playVideo();
                centerIndicator.textContent = '⏸️';
            }
            
            // Show center indicator briefly
            centerIndicator.classList.add('visible');
            setTimeout(() => {
                centerIndicator.classList.remove('visible');
            }, 500);
        }

        // Handle window resize
        function handleResize() {
            if (playerReady) {
                setVideoSize('16:9');
            }
        }

        // Initialize gesture controls
        function initGestureControls() {
            let startX, startY;
            let startTime, currentTime;
            let isHorizontalGesture = false;
            let isVerticalGesture = false;
            
            // Touch start event
            function handleTouchStart(e) {
                if (!playerReady) return;
                
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                startTime = Date.now();
                
                // Reset flags
                isHorizontalGesture = false;
                isVerticalGesture = false;
                isSeeking = false;
                isAdjustingVolume = false;
                isAdjustingBrightness = false;
                
                // Start long press timer
                isLongPressing = false;
                longPressTimer = setTimeout(() => {
                    isLongPressing = true;
                    player.setPlaybackRate(2);
                    showHud(speedHud, 1000);
                }, CONFIG.LONG_PRESS_DURATION);
                
                e.preventDefault();
            }
            
            // Touch move event
            function handleTouchMove(e) {
                if (!playerReady || !startX || !startY) return;
                
                const touch = e.touches[0];
                const deltaX = touch.clientX - startX;
                const deltaY = touch.clientY - startY;
                currentTime = Date.now();
                
                // Cancel long press if moved too much
                if (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10) {
                    clearTimeout(longPressTimer);
                }
                
                // Determine gesture direction after minimum movement
                if (!isHorizontalGesture && !isVerticalGesture) {
                    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 10) {
                        isHorizontalGesture = true;
                        isSeeking = true;
                    } else if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 10) {
                        isVerticalGesture = true;
                        
                        // Determine which side of screen for volume/brightness
                        if (startX < window.innerWidth / 2) {
                            isAdjustingBrightness = true;
                        } else {
                            isAdjustingVolume = true;
                        }
                    }
                }
                
                // Handle horizontal gesture (seeking)
                if (isHorizontalGesture && isSeeking) {
                    const timeDelta = (deltaX / window.innerWidth) * (player.getDuration() || 600) * CONFIG.SEEK_SENSITIVITY;
                    
                    // Apply velocity factor based on movement speed
                    const elapsed = currentTime - startTime;
                    const velocity = Math.min(3, 1 + (Math.abs(deltaX) / elapsed) * 0.1);
                    const adjustedDelta = timeDelta * velocity;
                    
                    seekVideo(adjustedDelta);
                }
                
                // Handle vertical gestures
                if (isVerticalGesture) {
                    const delta = -deltaY / window.innerHeight; // Invert for natural feel
                    
                    if (isAdjustingVolume) {
                        const volumeDelta = delta * CONFIG.VOLUME_SENSITIVITY * 100;
                        adjustVolume(volumeDelta);
                    } else if (isAdjustingBrightness) {
                        const brightnessDelta = delta * CONFIG.BRIGHTNESS_SENSITIVITY;
                        adjustBrightness(brightnessDelta);
                    }
                }
                
                e.preventDefault();
            }
            
            // Touch end event
            function handleTouchEnd(e) {
                clearTimeout(longPressTimer);
                
                // Reset playback speed if long press was active
                if (isLongPressing) {
                    player.setPlaybackRate(1);
                }
                
                // Reset all flags
                isHorizontalGesture = false;
                isVerticalGesture = false;
                isSeeking = false;
                isAdjustingVolume = false;
                isAdjustingBrightness = false;
                isLongPressing = false;
                startX = null;
                startY = null;
            }
            
            // Add event listeners to gesture overlay
            const gestureOverlay = document.getElementById('gesture-overlay');
            gestureOverlay.addEventListener('touchstart', handleTouchStart, { passive: false });
            gestureOverlay.addEventListener('touchmove', handleTouchMove, { passive: false });
            gestureOverlay.addEventListener('touchend', handleTouchEnd);
            
            // Double tap for play/pause on center panel
            let lastTap = 0;
            centerPanel.addEventListener('touchend', function(e) {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                
                if (tapLength < 300 && tapLength > 0) {
                    // Double tap detected
                    togglePlayPause();
                    e.preventDefault();
                }
                
                lastTap = currentTime;
            });
        }

        // Initialize the player
        function init() {
            initYouTubePlayer();
            initGestureControls();
            
            // Handle window resize
            window.addEventListener('resize', handleResize);
            
            // Single tap to show controls (delegated to YouTube player)
            document.getElementById('gesture-overlay').addEventListener('click', function() {
                // This will trigger YouTube's native controls to show
                // We don't need to do anything special here
            });
        }

        // Start initialization when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
