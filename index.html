<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>Soniq — Netflix-like Player (Fixed)</title>
<style>
  :root{
    --accent:#e50914; --bg:#000; --fg:#fff; --muted:rgba(255,255,255,0.08); --ui-h:56px;
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  #app{position:relative;height:100vh;width:100vw;overflow:hidden;touch-action:manipulation;background:#000;}
  #playerWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:10;}
  #yt-player{width:100%;height:100%;display:block;object-fit:cover;}
  #skeleton{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.02);z-index:40;}
  #spinner{width:48px;height:48px;border-radius:50%;border:6px solid rgba(255,255,255,0.06);border-top-color:var(--accent);animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* HUDs (fixed center) */
  .hudBox{
    position:fixed;
    left:50%; top:50%;
    transform:translate(-50%,-50%) scale(1);
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(8px);
    padding:12px 18px;
    border-radius:12px;
    color:#fff;
    font-size:16px;
    font-weight:700;
    display:none;
    align-items:center;
    gap:10px;
    z-index:999;
    opacity:0;
    transition:opacity .18s,transform .18s;
  }
  .hudBox.visible{display:flex;opacity:1;transform:translate(-50%,-50%) scale(1.05);}
  .hudBox.small{font-size:14px;padding:8px 12px;border-radius:10px;}
  .hudBox.seek{white-space:pre-line;text-align:center;}
  .hudIcon{font-size:20px;}
  .hudBar{width:4px;height:80px;background:rgba(255,255,255,0.2);border-radius:2px;margin-left:10px;flex-shrink:0;}
  .hudBarFill{height:50%;width:100%;background:#fff;border-radius:2px;transition:height .1s ease;}
  #vHud{right:20px;}
  #bHud{left:20px;}

  /* bottom controls */
  #controlsRow{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;z-index:60;pointer-events:auto;display:flex;flex-direction:column;gap:8px;opacity:0;transition:opacity .18s;}
  #app.controls-visible #controlsRow{opacity:1;}
  #scrubWrap{display:flex;align-items:center;gap:10px;}
  #timeLeft,#timeRight{color:#ddd;font-size:12px;min-width:54px;text-align:center;}
  .scrubContainer{flex:1;position:relative;height:46px;display:flex;align-items:center;}
  .progressBar{height:6px;border-radius:6px;background:rgba(255,255,255,0.1);width:100%;position:relative;overflow:visible;}
  .progressFill{height:100%;width:0%;background:var(--accent);border-radius:6px;transition:width 120ms linear;}
  .progressHandle{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,0.6);display:none;}
  .dragging .progressHandle{display:block;}

  #thumbPreview{position:absolute;bottom:58px;left:0;transform:translateX(-50%);pointer-events:none;display:none;z-index:70;text-align:center;}
  #thumbPreview .thumb{width:160px;height:90px;border-radius:6px;overflow:hidden;background:#111;display:block;box-shadow:0 6px 18px rgba(0,0,0,0.6);}
  #thumbPreview .time{margin-top:6px;color:#fff;font-size:12px;}

  /* center controls */
  #controlsCenter{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:60;pointer-events:auto;opacity:0;transition:opacity .18s,transform .18s;}
  #controlsCenter.visible{opacity:1;transform:translateX(-50%) translateY(-8px);}
  .btn{height:var(--ui-h);min-width:var(--ui-h);border-radius:12px;background:var(--muted);border:0;color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .2s;}
  .btn.small{height:44px;min-width:44px;font-size:15px;}
  .btn:hover{background:rgba(255,255,255,0.12);}
  .btn.active{background:var(--accent);color:#000;}

  /* settings popup */
  #settingsBtnWrap{position:absolute;right:12px;top:12px;z-index:80;}
  #settingsPopup{position:absolute;right:0;top:calc(100% + 8px);background:rgba(18,18,18,0.98);backdrop-filter:blur(10px);padding:16px;border-radius:12px;display:none;min-width:240px;box-shadow:0 8px 24px rgba(0,0,0,0.6);font-size:14px;}
  .settingsTitle{font-weight:700;margin-bottom:8px;}
  .settingsItem{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .settingsItem button{background:transparent;border:0;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;transition:all .2s;font-size:12px;}
  .settingsItem button.active{font-weight:700;color:var(--accent);}
  .settingsItem button:hover{background:rgba(255,255,255,0.1);}
  #endOverlay{position:absolute;inset:0;background:rgba(0,0,0,0.6);display:none;z-index:95;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
</style>
</head>
<body>
  <div id="app" aria-label="Video player">
    <div id="playerWrap"><div id="yt-player"></div></div>
    <div id="skeleton"><div id="spinner"></div></div>

    <!-- HUDs -->
    <div id="seekHud" class="hudBox seek"><span class="hudIcon" id="seekHudIcon">⟲</span><div id="seekHudText">+0s</div></div>
    <div id="vHud" class="hudBox small"><span class="hudIcon">🔊</span><span id="vHudVal">50%</span><div class="hudBar"><div class="hudBarFill"></div></div></div>
    <div id="bHud" class="hudBox small"><span class="hudIcon">🌞</span><span id="bHudVal">100%</span><div class="hudBar"><div class="hudBarFill"></div></div></div>

    <!-- bottom controls -->
    <div id="controlsRow">
      <div id="scrubWrap">
        <div id="timeLeft">00:00:00</div>
        <div class="scrubContainer">
          <div class="progressBar" id="progressBar">
            <div class="progressFill" id="progressFill"></div>
            <div class="progressHandle" id="progressHandle"></div>
          </div>
          <div id="thumbPreview"><div class="thumb"><img id="thumbImg" src="" style="width:100%;height:100%;object-fit:cover"/></div><div class="time" id="thumbTime">00:00</div></div>
        </div>
        <div id="timeRight">00:00:00</div>
      </div>
    </div>

    <!-- center controls -->
    <div id="controlsCenter">
      <button class="btn small" id="btnRewind">⟲</button>
      <button class="btn" id="btnPlay">▶︎</button>
      <button class="btn small" id="btnForward">⟳</button>
      <button class="btn small" id="btnSpeed">1×</button>
      <button class="btn small" id="btnCaptions">CC</button>
      <button class="btn small" id="btnMute">🔊</button>
    </div>

    <!-- settings -->
    <div id="settingsBtnWrap">
      <button class="btn small" id="btnSettings">⚙︎</button>
      <div id="settingsPopup">
        <div class="settingsTitle">Playback Speed</div>
        <div class="settingsItem" id="speedOptions"></div>
        <div class="settingsTitle">Quality</div>
        <div class="settingsItem" id="qualityOptions"></div>
      </div>
    </div>

    <div id="endOverlay">
      <div style="color:#fff;font-size:18px">Playback ended</div>
      <div><button id="replayBtn" class="btn">Replay</button></div>
    </div>
  </div>

<script>
const DEFAULT_ID='dQw4w9WgXcQ', SEEK_DOUBLE_TAP_SEC=10, DRAG_MAX_SEEK=120, CONTROLS_HIDE_MS=3000;
let player,isPlaying=false,isMuted=false,currentVolume=60,controlsTimer=null,touchActive=false;
const app=document.getElementById('app'), skeleton=document.getElementById('skeleton');
const seekHud=document.getElementById('seekHud'),seekHudText=document.getElementById('seekHudText'),seekHudIcon=document.getElementById('seekHudIcon');
const vHud=document.getElementById('vHud'),bHud=document.getElementById('bHud'),vHudVal=document.getElementById('vHudVal'),bHudVal=document.getElementById('bHudVal');
const vBarFill=document.querySelector('#vHud .hudBarFill'),bBarFill=document.querySelector('#bHud .hudBarFill');
const timeLeft=document.getElementById('timeLeft'),timeRight=document.getElementById('timeRight'),progressBar=document.getElementById('progressBar');
const progressFill=document.getElementById('progressFill'),progressHandle=document.getElementById('progressHandle');
const btnPlay=document.getElementById('btnPlay'),btnRewind=document.getElementById('btnRewind'),btnForward=document.getElementById('btnForward');
const btnMute=document.getElementById('btnMute'),btnSpeed=document.getElementById('btnSpeed'),btnCaptions=document.getElementById('btnCaptions');
const btnSettings=document.getElementById('btnSettings'),settingsPopup=document.getElementById('settingsPopup'),speedOptions=document.getElementById('speedOptions'),qualityOptions=document.getElementById('qualityOptions');
const controlsCenter=document.getElementById('controlsCenter'),endOverlay=document.getElementById('endOverlay'),replayBtn=document.getElementById('replayBtn');

(function(){const s=document.createElement('script');s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s);})();
function onYouTubeIframeAPIReady(){
  player=new YT.Player('yt-player',{
    videoId:DEFAULT_ID,
    playerVars:{autoplay:1,controls:0,rel:0,modestbranding:1,playsinline:1,enablejsapi:1},
    events:{onReady:onPlayerReady,onStateChange:onPlayerStateChange}
  });
}
function onPlayerReady(e){ skeleton.style.display='none'; player.playVideo(); populateSpeedOptions(); populateQualityOptions(); showControlsTemporarily(); }
function onPlayerStateChange(e){isPlaying=e.data===1;updateUI();if(e.data===0)endOverlay.style.display='flex';else endOverlay.style.display='none';}
function updateUI(){btnPlay.textContent=isPlaying?'❚❚':'▶︎';btnMute.textContent=isMuted?'🔇':'🔊';}
btnPlay.onclick=()=>isPlaying?player.pauseVideo():player.playVideo();
btnRewind.onclick=()=>seek(-SEEK_DOUBLE_TAP_SEC);
btnForward.onclick=()=>seek(SEEK_DOUBLE_TAP_SEC);
btnMute.onclick=()=>{isMuted=!isMuted;isMuted?player.mute():player.unMute();updateUI();showVolumeHud(player.getVolume());}
btnSpeed.onclick=toggleSettingsPopup;
btnSettings.onclick=toggleSettingsPopup;
replayBtn.onclick=()=>{player.seekTo(0);player.playVideo();endOverlay.style.display='none';}
btnCaptions.onclick=()=>{try{const cur=player.getOption('captions','display');player.setOption('captions','display',!cur);}catch(e){alert('Captions unavailable');}};
function seek(sec){player.seekTo(player.getCurrentTime()+sec,true);showSeekHud(sec);}
function showSeekHud(delta){seekHudText.textContent=(delta>0?'+':'')+delta+'s';seekHudIcon.textContent=delta>0?'⟳':'⟲';seekHud.classList.add('visible');clearTimeout(seekHud._t);seekHud._t=setTimeout(()=>seekHud.classList.remove('visible'),800);}
function showVolumeHud(p){vHudVal.textContent=Math.round(p)+'%';vBarFill.style.height=p+'%';vHud.classList.add('visible');clearTimeout(vHud._t);vHud._t=setTimeout(()=>vHud.classList.remove('visible'),800);}
function showBrightnessHud(p){bHudVal.textContent=Math.round(p)+'%';bBarFill.style.height=p+'%';bHud.classList.add('visible');clearTimeout(bHud._t);bHud._t=setTimeout(()=>bHud.classList.remove('visible'),800);}
function toggleSettingsPopup(){if(settingsPopup.style.display==='block')settingsPopup.style.display='none';else{populateSpeedOptions();populateQualityOptions();settingsPopup.style.display='block';setTimeout(()=>{document.addEventListener('click',offClick);},10);}function offClick(e){if(!settingsPopup.contains(e.target)&&e.target!==btnSettings){settingsPopup.style.display='none';document.removeEventListener('click',offClick);}}}
function populateSpeedOptions(){speedOptions.innerHTML='';const speeds=[0.5,0.75,1,1.25,1.5,2];const cur=player.getPlaybackRate();speeds.forEach(s=>{const b=document.createElement('button');b.textContent=s+'×';b.classList.toggle('active',Math.abs(s-cur)<1e-6);b.onclick=()=>{player.setPlaybackRate(s);populateSpeedOptions();};speedOptions.appendChild(b);});}
function populateQualityOptions(){qualityOptions.innerHTML='';let lv=[];try{lv=player.getAvailableQualityLevels();}catch(e){}if(!lv.length){qualityOptions.innerHTML='<div style="color:#888">Auto (managed by YouTube)</div>';return;}const cur=player.getPlaybackQuality();lv.forEach(q=>{const b=document.createElement('button');b.textContent=q;b.classList.toggle('active',q===cur);b.onclick=()=>{player.setPlaybackQuality(q);populateQualityOptions();};qualityOptions.appendChild(b);});}

/* show controls globally */
['pointerdown','touchstart','mousemove'].forEach(ev=>app.addEventListener(ev,showControlsTemporarily,{passive:true}));
function showControlsTemporarily(){app.classList.add('controls-visible');controlsCenter.classList.add('visible');clearTimeout(controlsTimer);controlsTimer=setTimeout(()=>{app.classList.remove('controls-visible');controlsCenter.classList.remove('visible');},CONTROLS_HIDE_MS);}

/* gestures */
let startX=0,startY=0,adjustType=null;
app.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;startX=e.touches[0].clientX;startY=e.touches[0].clientY;adjustType=null;});
app.addEventListener('touchmove',e=>{
 const t=e.touches[0];const dx=t.clientX-startX,dy=t.clientY-startY;
 if(!adjustType){if(Math.abs(dx)>Math.abs(dy))adjustType='seek';else adjustType=(startX>window.innerWidth/2)?'volume':'brightness';}
 if(adjustType==='seek'){const pct=dx/window.innerWidth;const delta=Math.round(pct*DRAG_MAX_SEEK);showSeekHud(delta);}
 if(adjustType==='volume'){let v=player.getVolume()+(-dy/window.innerHeight*100);v=Math.max(0,Math.min(100,v));player.setVolume(v);showVolumeHud(v);}
 if(adjustType==='brightness'){let p=-dy/window.innerHeight;let el=document.getElementById('playerWrap');let cur=parseFloat(el.dataset.b||1);cur=Math.max(0.5,Math.min(1.6,cur+p*0.3));el.style.filter=`brightness(${cur})`;el.dataset.b=cur;showBrightnessHud(((cur-0.5)/1.1)*100);}
 e.preventDefault();
},{passive:false});

/* progress updater */
function fmt(s){s=Math.floor(s);const m=Math.floor(s/60),sec=s%60;return m+':'+String(sec).padStart(2,'0');}
function loop(){if(player&&player.getDuration){const d=player.getDuration()||0,c=player.getCurrentTime()||0;timeLeft.textContent=fmt(c);timeRight.textContent=fmt(d);const p=(d>0)?(c/d*100):0;progressFill.style.width=p+'%';progressHandle.style.left=p+'%';}requestAnimationFrame(loop);}loop();
</script>
</body>
</html>
