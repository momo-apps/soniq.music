<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>Soniq — Clean Player</title>
<style>
  :root {
    --accent:#1db954; 
    --bg:#000; 
    --fg:#fff;
    --muted:rgba(255,255,255,0.06);
    --ui-h:56px;
  }
  html,body {
    height:100%; margin:0;
    background:var(--bg); color:var(--fg);
    font-family:system-ui,Arial,Helvetica;
  }
  #app {
    position:relative; height:100vh; width:100vw;
    overflow:hidden; touch-action:none;
    background:#000;
  }

  /* player + skeleton */
  #playerWrap { position:absolute; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:10; }
  #yt-player { width:100%; height:100%; object-fit:cover; }
  #skeleton { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(90deg, rgba(255,255,255,0.01), rgba(255,255,255,0.02)); z-index:40; }
  #spinner { width:48px; height:48px; border-radius:50%; border:6px solid rgba(255,255,255,0.06); border-top-color:var(--accent); animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Netflix-like HUDs */
  .hudBox {
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%, -50%) scale(1);
    background:rgba(0,0,0,0.65);
    padding:12px 20px;
    border-radius:12px;
    color:#fff;
    font-size:16px;
    font-weight:600;
    display:none;
    align-items:center;
    gap:8px;
    opacity:0;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:999;
  }
  .hudBox.visible {
    display:flex;
    opacity:1;
    transform:translate(-50%, -50%) scale(1.05);
  }
  .hudBox i { font-style:normal; font-size:18px; }

  /* bottom controls */
  #controlsRow {
    position:absolute; left:0; right:0; bottom:0;
    padding:10px 12px; z-index:60;
    pointer-events:none; display:flex; flex-direction:column; gap:8px;
    opacity:0; transition:opacity .25s ease;
  }
  #app.controls-visible #controlsRow { opacity:1; pointer-events:auto; }

  #scrubWrap { display:flex; align-items:center; gap:10px; pointer-events:auto; }
  #timeLeft,#timeRight { color:#ddd; font-size:12px; min-width:54px; text-align:center; }
  .scrubContainer { flex:1; position:relative; height:46px; display:flex; align-items:center; }
  .progressBar { height:6px; border-radius:6px; background:rgba(255,255,255,0.06); width:100%; position:relative; overflow:visible; }
  .progressFill { height:100%; width:0%; background:var(--accent); border-radius:6px; transition:width 120ms linear; }
  .progressHandle { position:absolute; top:50%; transform:translate(-50%,-50%); width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 1px 6px rgba(0,0,0,0.6); display:none; }
  .dragging .progressHandle { display:block; }

  /* controls center row */
  #controlsCenter {
    position:absolute; left:50%; bottom:110px; transform:translate(-50%,-55%);
    display:flex; gap:10px; align-items:center; z-index:60;
    pointer-events:auto; opacity:0; transition:opacity .25s ease, transform .25s ease;
  }
  #controlsCenter.visible { opacity:1; transform:translate(-50%,-50%); }

  .btn {
    height:var(--ui-h); min-width:var(--ui-h);
    border-radius:12px; background:var(--muted);
    border:0; color:var(--fg);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer;
  }
  .btn.small { height:44px; min-width:44px; font-size:15px; }

  /* settings popup */
  #settingsBtnWrap { position:absolute; right:12px; top:12px; z-index:80; pointer-events:auto; }
  #settingsPopup {
    position:absolute; right:0; top:calc(100% + 8px);
    background:rgba(18,18,18,0.98); padding:10px;
    border-radius:10px; display:none;
    min-width:200px; box-shadow:0 8px 24px rgba(0,0,0,0.6);
  }
  .settingsItem { color:#fff; padding:8px 6px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; font-size:14px; }
  .settingsItem button { background:transparent; border:0; color:#fff; padding:6px 10px; border-radius:6px; }

  /* hide end suggestions */
  #endOverlay { position:absolute; inset:0; display:none; background:#000; z-index:95; align-items:center; justify-content:center; flex-direction:column; gap:12px; }

  @keyframes fadeInOut { from { opacity:0; } to { opacity:1; } }
</style>
</head>
<body>
<div id="app">
  <div id="playerWrap"><div id="yt-player"></div></div>
  <div id="skeleton"><div id="spinner"></div></div>

  <!-- HUDs -->
  <div id="vHud" class="hudBox"><i>🔊</i><span id="vHudVal">50%</span></div>
  <div id="bHud" class="hudBox"><i>🌞</i><span id="bHudVal">100%</span></div>

  <!-- bottom controls -->
  <div id="controlsRow">
    <div id="scrubWrap">
      <div id="timeLeft">00:00:00</div>
      <div class="scrubContainer">
        <div class="progressBar" id="progressBar">
          <div class="progressFill" id="progressFill"></div>
          <div class="progressHandle" id="progressHandle"></div>
        </div>
      </div>
      <div id="timeRight">00:00:00</div>
    </div>
  </div>

  <!-- center controls -->
  <div id="controlsCenter">
    <button class="btn small" id="btnRewind">⟲</button>
    <button class="btn" id="btnPlay">▶︎</button>
    <button class="btn small" id="btnForward">⟳</button>
    <button class="btn small" id="btnSpeed">1×</button>
    <button class="btn small" id="btnMute">🔇</button>
  </div>

  <!-- single settings button -->
  <div id="settingsBtnWrap">
    <button class="btn small" id="btnSettings" title="Settings">⚙︎</button>
    <div id="settingsPopup" role="dialog">
      <div style="font-weight:700;margin-bottom:6px">Playback</div>
      <div class="settingsItem"><div>Playback speed</div><div id="speedOptions"></div></div>
      <div style="height:8px"></div>
      <div class="settingsItem"><div>Quality</div><div id="qualityOptions"></div></div>
    </div>
  </div>

  <!-- End overlay (hidden) -->
  <div id="endOverlay" style="display:none;">
    <div style="color:#fff;font-size:18px">Playback ended</div>
    <div><button id="replayBtn">Replay</button></div>
  </div>
</div>

<script>
/* ===== config ===== */
const DEFAULT_ID='dQw4w9WgXcQ', SEEK_DOUBLE_TAP_SEC=10, DRAG_MAX_SEEK=120, INITIAL_MUTED=true, CONTROLS_HIDE_MS=3000;

/* ===== refs ===== */
const app=document.getElementById('app');
const skeleton=document.getElementById('skeleton');
const vHud=document.getElementById('vHud'), bHud=document.getElementById('bHud');
const vHudVal=document.getElementById('vHudVal'), bHudVal=document.getElementById('bHudVal');
const timeLeft=document.getElementById('timeLeft'), timeRight=document.getElementById('timeRight');
const progressBar=document.getElementById('progressBar'), progressFill=document.getElementById('progressFill'), progressHandle=document.getElementById('progressHandle');
const btnPlay=document.getElementById('btnPlay'), btnRewind=document.getElementById('btnRewind'), btnForward=document.getElementById('btnForward');
const btnMute=document.getElementById('btnMute'), btnSpeed=document.getElementById('btnSpeed');
const btnSettings=document.getElementById('btnSettings'), settingsPopup=document.getElementById('settingsPopup');
const speedOptions=document.getElementById('speedOptions'), qualityOptions=document.getElementById('qualityOptions');
const controlsCenter=document.getElementById('controlsCenter'), endOverlay=document.getElementById('endOverlay'), replayBtn=document.getElementById('replayBtn');

let player=null, videoId=(new URLSearchParams(location.search)).get('videoId')||DEFAULT_ID;
let isPlaying=false, isMuted=INITIAL_MUTED, durationSec=0, controlsTimer=null, currentVolume=50;

/* ===== load YT API ===== */
(function(){const t=document.createElement('script'); t.src="https://www.youtube.com/iframe_api"; t.async=true; document.head.appendChild(t);})();

function onYouTubeIframeAPIReady(){
  player=new YT.Player('yt-player',{
    width:'100%', height:'100%', videoId:videoId,
    playerVars:{autoplay:1,controls:0,rel:0,modestbranding:1,enablejsapi:1,fs:0,mute:INITIAL_MUTED?1:0,origin:window.location.origin,playsinline:1},
    events:{onReady:onPlayerReady,onStateChange:onPlayerStateChange,onError:onPlayerError}
  });
}

function onPlayerReady(evt){
  skeleton.style.display='none';
  evt.target.playVideo();
  player.unMute(); player.setVolume(60); isMuted=false; updateUI();
  populateSpeedOptions(); populateQualityOptions();
  showControlsTemporarily();
}

function onPlayerStateChange(ev){
  isPlaying=(ev.data===1);
  endOverlay.style.display=(ev.data===0)?'flex':'none';
  updateUI();
}
function onPlayerError(ev){ alert('Playback error: '+ev.data); }

function updateUI(){
  btnPlay.textContent=isPlaying?'❚❚':'▶︎';
  btnMute.textContent=isMuted?'🔇':'🔊';
}

/* ===== Controls ===== */
btnPlay.onclick=()=>getStateThen(s=>s===1?player.pauseVideo():player.playVideo());
btnRewind.onclick=()=>getTimeThen(t=>player.seekTo(Math.max(0,t-SEEK_DOUBLE_TAP_SEC)));
btnForward.onclick=()=>getTimeThen(t=>player.seekTo(t+SEEK_DOUBLE_TAP_SEC));
btnMute.onclick=()=>{isMuted=!isMuted;isMuted?player.mute():player.unMute();updateUI();showVolumeHud(player.getVolume());showControlsTemporarily();}
btnSpeed.onclick=()=>openSettings();

btnSettings.onclick=toggleSettingsPopup;
replayBtn.onclick=()=>{player.seekTo(0);player.playVideo();endOverlay.style.display='none';};

/* ===== Settings ===== */
function toggleSettingsPopup(){
  settingsPopup.style.display=(settingsPopup.style.display==='block'?'none':'block');
}
function openSettings(){ settingsPopup.style.display='block'; populateSpeedOptions(); populateQualityOptions(); }

function populateSpeedOptions(){
  speedOptions.innerHTML='';
  const speeds=[0.5,0.75,1,1.25,1.5,2];
  const cur=player.getPlaybackRate();
  speeds.forEach(s=>{
    const b=document.createElement('button');
    b.textContent=s+'×';
    b.style.fontWeight=(Math.abs(s-cur)<1e-6)?'700':'400';
    b.onclick=()=>{player.setPlaybackRate(s);btnSpeed.textContent=s+'×';populateSpeedOptions();}
    speedOptions.appendChild(b);
  });
}
function populateQualityOptions(){
  qualityOptions.innerHTML='';
  let levels=player.getAvailableQualityLevels()||['hd1080','hd720','large','medium'];
  const cur=player.getPlaybackQuality();
  levels.forEach(q=>{
    const b=document.createElement('button');
    b.textContent=q;
    b.style.fontWeight=(q===cur)?'700':'400';
    b.onclick=()=>{player.setPlaybackQuality(q);populateQualityOptions();}
    qualityOptions.appendChild(b);
  });
}

/* ===== HUDs ===== */
let hudTimerV=null, hudTimerB=null;
function showVolumeHud(p){
  vHud.style.display='flex';
  vHud.classList.add('visible');
  vHudVal.textContent=Math.round(p)+'%';
  clearTimeout(hudTimerV);
  hudTimerV=setTimeout(()=>{vHud.classList.remove('visible');setTimeout(()=>vHud.style.display='none',200);},800);
}
function showBrightnessHud(p){
  bHud.style.display='flex';
  bHud.classList.add('visible');
  bHudVal.textContent=Math.round(p)+'%';
  clearTimeout(hudTimerB);
  hudTimerB=setTimeout(()=>{bHud.classList.remove('visible');setTimeout(()=>bHud.style.display='none',200);},800);
}

/* ===== Gestures (simplified) ===== */
app.addEventListener('touchstart',()=>showControlsTemporarily());
document.addEventListener('mousemove',()=>showControlsTemporarily());

/* ===== Controls hide/show ===== */
function showControlsTemporarily(){
  app.classList.add('controls-visible');
  controlsCenter.classList.add('visible');
  clearTimeout(controlsTimer);
  if(settingsPopup.style.display==='block') return;
  controlsTimer=setTimeout(()=>{app.classList.remove('controls-visible');controlsCenter.classList.remove('visible');},CONTROLS_HIDE_MS);
}

/* ===== Loop ===== */
function format(sec){sec=Math.max(0,Math.floor(sec||0));const m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0');}
function rafLoop(){
  try{
    const cur=Math.floor(player.getCurrentTime()||0),dur=Math.floor(player.getDuration()||0);
    timeLeft.textContent=format(cur);timeRight.textContent=format(dur);
    const pct=(dur>0)?Math.min(1,cur/dur):0;
    progressFill.style.width=(pct*100)+'%';progressHandle.style.left=(pct*100)+'%';
  }catch(e){}
  requestAnimationFrame(rafLoop);
}
requestAnimationFrame(rafLoop);

function getStateThen(cb){try{cb(player.getPlayerState());}catch(e){cb(-2);}}
function getTimeThen(cb){try{cb(player.getCurrentTime());}catch(e){cb(0);}}
</script>
</body>
</html>
